<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sổ Chi Tiêu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="theme-color" content="#14B8A6">
<script>try{var _t=localStorage.getItem("so-chi-tieu-theme"),_a=localStorage.getItem("so-chi-tieu-acc");if(_t)document.documentElement.dataset.theme=_t;if(_a)document.documentElement.dataset.acc=_a;}catch(e){}</script>
<meta name="description" content="Sổ chi tiêu cá nhân: ghi thu chi, ngân sách, báo cáo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Chi Tiêu">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sổ tài chính cá nhân — thanh điều hướng trái (máy tính) / thanh tab dưới (điện thoại), vùng làm việc dạng lưới thẻ. */
:root {
  --nfb: calc(64px + env(safe-area-inset-bottom)); /* chừa chỗ cho dòng Powered by Netlify */
  color-scheme: light;
  --bg: #f3f5f4;
  --surface: #ffffff;
  --surface-2: #edf1ef;
  --ink: #14201d;
  --ink-2: #4a5a55;
  --muted: #74847f;
  --line: #dce3e0;
  --accent: #0f6b5c;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe9;
  --pos: #0b7a4b;
  --inc: #1baf7a;
  --exp: #eb6834;
  --good: #0ca30c;
  --warn: #fab219;
  --crit: #d03b3b;
  --shadow: 0 1px 2px rgba(20,32,29,.06), 0 4px 16px rgba(20,32,29,.05);
  --hero-a: #0b5a4d; --hero-b: #17927a; --hero-ink: #ffffff;
  --c0: #8f9a96; --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --font-display: "Lexend", "Be Vietnam Pro", system-ui, sans-serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1413; --surface: #161e1c; --surface-2: #1f2a27; --ink: #e7eeeb; --ink-2: #b3c1bc;
    --muted: #84948f; --line: #2a3633; --accent: #44b8a0; --accent-ink: #062019; --accent-soft: #17332d;
    --pos: #5fcf9a; --inc: #199e70; --exp: #d95926;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    --hero-a: #0f4d43; --hero-b: #1a7a67; --hero-ink: #ffffff;
    --c0: #6f7b77; --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #0ca30c; --c7: #9085e9; --c8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1413; --surface: #161e1c; --surface-2: #1f2a27; --ink: #e7eeeb; --ink-2: #b3c1bc;
  --muted: #84948f; --line: #2a3633; --accent: #44b8a0; --accent-ink: #062019; --accent-soft: #17332d;
  --pos: #5fcf9a; --inc: #199e70; --exp: #d95926;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  --hero-a: #0f4d43; --hero-b: #1a7a67; --hero-ink: #ffffff;
  --c0: #6f7b77; --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
  --c5: #d55181; --c6: #0ca30c; --c7: #9085e9; --c8: #e66767;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
button, .chip, [role="button"] { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.btn:active, .chip:active, .tx:active, .fbtile:active, .fbrow:active, .ms-card:active, .icbtn:active, .icon-btn:active, .hamb:active, .fab:active { transform: scale(.97); opacity: .85; }
.day, .ov-sec:not(.span2), .loan-row { content-visibility: auto; contain-intrinsic-size: auto 280px; }
.ov-grid.editing .ov-sec { content-visibility: visible; }
.upd { position: fixed; left: 50%; transform: translateX(-50%); top: calc(64px + env(safe-area-inset-top)); z-index: 70; display: flex; align-items: center; gap: 12px; background: var(--ink); color: var(--bg); padding: 8px 8px 8px 16px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.25); font-size: 14px; white-space: nowrap; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 22px; }
h2 { font-size: 16px; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: block; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 15px var(--font-display); }
.brand-name { font: 600 17px var(--font-display); }
.nav-btn { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; border: 0; background: none; cursor: pointer; text-align: left; color: var(--ink-2); font-weight: 500; }
.nav-btn svg { width: 18px; height: 18px; flex: none; }
.nav-btn:hover { background: var(--surface-2); color: var(--ink); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side .add-main { margin-top: 14px; }
.side-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 0 10px; }

.main { padding: 20px 28px calc(var(--nfb) + 24px); max-width: 1120px; width: 100%; margin: 0 auto; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.month-pick { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.month-pick button { width: 32px; height: 32px; border: 0; background: none; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-size: 18px; line-height: 1; }
.month-pick button:hover { background: var(--surface-2); }
.month-pick .lbl { min-width: 118px; text-align: center; font-weight: 600; font-size: 14px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); background: var(--accent); }
.btn.danger { color: var(--crit); }
.btn.sm { height: 32px; padding: 0 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: none; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); font-size: 13px; margin-bottom: 16px; }
.banner b { color: var(--ink); }

.grid { display: grid; gap: 16px; }
.tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.two { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h .link { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 13px; cursor: pointer; padding: 4px; }
.stack { display: flex; flex-direction: column; gap: 16px; }

.tile .k { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.tile .k i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.tile .v { font: 600 22px/1.25 var(--font-display); margin-top: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.tile .s { font-size: 12px; color: var(--muted); margin-top: 4px; }
.tile.hero { background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); color: var(--hero-ink); border-color: transparent; position: relative; overflow: hidden; }
.tile.hero::after { content: ""; position: absolute; right: -30px; top: -30px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.08); }
.tile.hero .k, .tile.hero .s { color: inherit; opacity: .85; }
.tile .k .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--cc) 15%, transparent); color: var(--cc); }
.tile.hero .k .ic { background: rgba(255,255,255,.16); color: #fff; }
.tile .k .ic svg { width: 16px; height: 16px; }
.tile.inc { border-top: 3px solid var(--inc); }
.tile.exp { border-top: 3px solid var(--exp); }
.tile.net { border-top: 3px solid var(--c1); }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; background: var(--cc); }
.donut-box { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 18px; align-items: center; }
.donut-box svg { width: 170px; height: 170px; display: block; }
.donut-box .seg-arc { cursor: default; transition: opacity .15s; }
.donut-box svg:hover .seg-arc { opacity: .55; }
.donut-box svg .seg-arc:hover { opacity: 1; }
.leg-list { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.leg-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13.5px; padding: 4px 0; }
.leg-row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.leg-row .vv { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.leg-row .vv b { color: var(--ink); font-weight: 600; margin-right: 6px; }
@media (max-width: 460px) { .donut-box { grid-template-columns: 1fr; justify-items: center; } .leg-list { width: 100%; } }
.swatch { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); background: var(--cc); cursor: pointer; padding: 0; }
.legend.wrap { flex-wrap: wrap; gap: 6px 14px; }

.wallets { display: flex; flex-direction: column; }
.wallet-row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.wallet-row:first-child { border-top: 0; }
.wallet-row .n { color: var(--ink-2); }
.wallet-row .b { font-weight: 600; font-variant-numeric: tabular-nums; }
.neg-bal { color: var(--crit); }

/* danh sách giao dịch */
.tx { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 9px 6px; border: 0; background: none; border-radius: 9px; cursor: pointer; text-align: left; }
.tx:hover { background: var(--surface-2); }
.badge { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); font: 600 14px var(--font-display); }
.badge.inc { background: var(--accent-soft); color: var(--accent); }
.badge.cc { background: color-mix(in srgb, var(--cc) 16%, transparent); color: var(--cc); }
.badge.trf { background: transparent; border: 1px dashed var(--line); }
.tx .t1 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .t2 { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .amt { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.amt.pos { color: var(--pos); }
.amt.trf { color: var(--muted); }
.day { margin-top: 10px; }
.day-h { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); padding: 6px 6px 4px; border-bottom: 1px solid var(--line); margin-bottom: 2px; }
.day-h b { color: var(--ink-2); font-weight: 600; }

.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.empty p { margin: 0 0 12px; }

/* thanh tiến độ */
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 8px 0; }
.bar-row .nm { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row .val { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }
.track { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.fill { height: 100%; border-radius: 4px; background: var(--exp); min-width: 2px; }
.fill.good { background: var(--good); } .fill.warn { background: var(--warn); } .fill.crit { background: var(--crit); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); }
.pill.crit { background: color-mix(in srgb, var(--crit) 16%, transparent); color: var(--crit); }
.pill.warn { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--ink); }
.pill.good { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--pos); }

/* bộ lọc */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.filters input, .filters select { height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 0 10px; }
.filters input { flex: 1 1 180px; min-width: 0; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 13.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
.sum-line { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); padding: 4px 6px; }
.sum-line b { font-variant-numeric: tabular-nums; color: var(--ink); }

/* biểu đồ */
.chart-wrap { position: relative; }
.chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart-wrap .ax { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart-wrap .gl { stroke: var(--line); stroke-width: 1; }
.chart-wrap .base { stroke: var(--ink-2); stroke-width: 1; opacity: .5; }
.hit { fill: transparent; cursor: default; }
.hit:hover { fill: var(--ink); fill-opacity: .04; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 9px; padding: 8px 10px; font-size: 12.5px; min-width: 170px; z-index: 5; display: none; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
.tip .r i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }
.tip .h { font-weight: 600; margin-bottom: 4px; }

table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.data th, table.data td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
.tbl-wrap { overflow-x: auto; }

/* cài đặt */
.set-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 0; }
.set-row.cat { grid-template-columns: auto minmax(0, 1fr) auto; }
.field { height: 38px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 0 10px; width: 100%; min-width: 0; }
.field.r { text-align: right; font-variant-numeric: tabular-nums; }
.set-head { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 8px; font-size: 12px; color: var(--muted); }
.hint { font-size: 12.5px; color: var(--muted); }
.budget-row { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 6px 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.budget-row:first-child { border-top: 0; }
.budget-row .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--ink-2); grid-column: 1 / -1; flex-wrap: wrap; }
.budget-row .track { grid-column: 1 / -1; }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(8,14,12,.45); display: none; align-items: center; justify-content: center; padding: 16px 16px var(--nfb); z-index: 50; }
.scrim.open { display: flex; }
.modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 460px; max-height: calc(100% - 16px); overflow: auto; padding: 18px 20px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal h2 { font-size: 18px; margin-bottom: 14px; }
.modal label { display: block; font-size: 12.5px; color: var(--ink-2); font-weight: 500; margin: 12px 0 5px; }
.amount-in { width: 100%; height: 56px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); padding: 0 14px; font: 600 26px var(--font-display); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-size: 13.5px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-actions { display: flex; gap: 8px; margin-top: 20px; }
.modal-actions .sp { flex: 1; }
.err { color: var(--crit); font-size: 13px; margin-top: 8px; min-height: 1em; }

.toast { position: fixed; left: 50%; bottom: calc(var(--nfb) + 72px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 13.5px; z-index: 60; display: none; max-width: calc(100% - 32px); }
.toast.show { display: block; }

.tabbar, .fab, .side { display: none; }
.fbmenu { display: none; }
.mp-wrap { position: relative; }
.brand-mark { background: none !important; padding: 0; overflow: hidden; }
.brand-mark svg { width: 100%; height: 100%; display: block; }
input[type="date"] { -webkit-appearance: none; appearance: none; min-width: 0; max-width: 100%; text-align: left; display: block; }
input[type="date"]::-webkit-date-and-time-value { text-align: left; }
.lbl-hint { font-weight: 400; color: var(--accent); margin-left: 4px; font-size: 12px; }
.icon-btn { width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); cursor: pointer; display: inline-grid; place-items: center; font-size: 15px; flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.topbar .btn svg { width: 16px; height: 16px; }
.ov-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; grid-auto-flow: row dense; align-items: stretch; }
.ov-sec { min-width: 0; }
.ov-sec.span2 { grid-column: 1 / -1; }
.ov-sec > .sec-body, .ov-sec > .sec-body > .card { height: 100%; }
.ov-sec > .sec-body > .tiles { height: auto; }
.ov-grid.editing { grid-template-columns: 1fr; gap: 8px; max-width: 560px; }
.sec-bar { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; box-shadow: var(--shadow); }
.sec-bar.off { opacity: .55; }
.sec-bar .sp { flex: 1; }
.drag-h { cursor: grab; color: var(--muted); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; touch-action: none; flex: none; font-size: 18px; }
.drag-h:hover { background: var(--surface-2); color: var(--ink); }
.drag-ghost { opacity: .35; }
.drag-chosen .sec-bar, .drag-chosen.fbtile { box-shadow: 0 10px 30px rgba(0,0,0,.18); }

<script>
(function () {
"use strict";

/* ---------- tiện ích ---------- */
const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nf = new Intl.NumberFormat("vi-VN");
const fmt = n => nf.format(Math.round(n)) + " ₫";
const fmtNum = n => nf.format(Math.round(n));
function fmtShort(n) { // luôn hiện đủ số dạng 1.000.000, không viết tắt k / tr / tỷ
  return (n < 0 ? "−" : "") + nf.format(Math.round(Math.abs(n)));
}
function parseAmount(raw) {
  const digits = String(raw || "").replace(/\D/g, "");
  const v = digits ? parseInt(digits, 10) : 0;
  return Number.isFinite(v) && v > 0 ? v : 0;
}
/* Định dạng ô tiền khi đang gõ: chỉ giữ chữ số, tự thêm dấu chấm hàng nghìn */
function formatAmountInput(inp) {
  const raw = inp.value, digits = raw.replace(/\D/g, "");
  const caretFromEnd = raw.length - (inp.selectionStart ?? raw.length);
  inp.value = digits ? fmtNum(parseInt(digits, 10)) : "";
  const p = Math.max(0, inp.value.length - caretFromEnd);
  try { inp.setSelectionRange(p, p); } catch (e) {}
}
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const shiftMonth = (key, delta) => { let [y, m] = key.split("-").map(Number); m += delta; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${pad(m)}`; };
const monthLabel = key => { const [y, m] = key.split("-"); return `Tháng ${+m}/${y}`; };
const monthShort = key => { const [y, m] = key.split("-"); return `T${+m}/${y.slice(2)}`; };
const DOW = ["Chủ nhật", "Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7"];
const isoDay = ts => { const x = new Date(ts); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`; };
const dayLabel = ds => { const [y, m, d] = ds.split("-").map(Number); const dt = new Date(y, m - 1, d); const t = todayStr(); return (ds === t ? "Hôm nay" : DOW[dt.getDay()]) + `, ${pad(d)}/${pad(m)}`; };

function defaults() {
  const c = (name, type, i) => ({ id: newId() + name.length, name, type, color: /khác/i.test(name) ? 0 : i + 1, icon: guessIcon(name) });
  return {
    wallets: [
      { id: "w-cash", name: "Tiền mặt", initial: 0 },
      { id: "w-bank", name: "Tài khoản ngân hàng", initial: 0 },
      { id: "w-ewallet", name: "Ví điện tử", initial: 0 },
      { id: "w-credit", name: "Thẻ tín dụng", initial: 0 }
    ],
    categories: [
      ...["Ăn uống", "Đi lại", "Nhà cửa", "Hóa đơn", "Mua sắm", "Giải trí", "Sức khỏe", "Giáo dục", "Khác"].map((n, i) => c(n, "expense", i)),
      ...["Lương", "Thưởng", "Kinh doanh", "Quà tặng", "Thu khác"].map((n, i) => c(n, "income", i))
    ],
    budgets: {}
  };
}

/* ---------- trạng thái ---------- */
const S = {
  settings: null,
  months: {},          // "YYYY-MM" -> [tx]
  mode: "loading",     // loading | cloud | local
  month: todayStr().slice(0, 7),
  view: "tong-quan",
  f: { type: "all", cat: "", wallet: "", q: "", from: "", to: "" },
  mp: null,
  loanTab: "borrow",
  range: 6,
  slow: false,
  auth: "unknown",
  sync: "ok",
  authTab: "login",
  skipLogin: (() => { try { return localStorage.getItem("so-chi-tieu-skip-login") === "1"; } catch (e) { return false; } })()
};

/* ---------- lưu trữ ---------- */
// Điền 2 giá trị của dự án Supabase để bật đăng nhập và đồng bộ. Để trống thì sổ chỉ lưu trên thiết bị.
const SUPABASE_URL = "https://mzkevskppdetztypdzdt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_axkJ2_McUZ_uFFHtGkLvLg_V3oBvuTy";

const LS_KEY = "so-chi-tieu-v1";
const SKIP_KEY = "so-chi-tieu-skip-login";
let sb = null, uid = null, channel = null;
let synced = {};                          // id -> chuỗi JSON đã có trên máy chủ
let pend = { up: {}, del: {}, settings: false };
let flushing = false, flushTimer = null, retryTimer = null, lastLoad = 0, renderTimer = null;

const cacheKey = () => "so-chi-tieu-sync:" + uid;
const stable = o => JSON.stringify(o, Object.keys(o).sort());
const pendCount = () => Object.keys(pend.up).length + Object.keys(pend.del).length + (pend.settings ? 1 : 0);

function lsLoad() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { const d = JSON.parse(raw); S.settings = d.settings; S.months = d.months || {}; S.lastBackup = d.lastBackup || null; } } catch (e) {}
  if (!S.settings) S.settings = defaults();
}
function lsSave() {
  if (S.mode === "sync") { saveCache(); return; }
  try { localStorage.setItem(LS_KEY, JSON.stringify({ settings: S.settings, months: S.months, lastBackup: S.lastBackup || null })); }
  catch (e) { toast("Không lưu được: bộ nhớ trình duyệt đã đầy hoặc bị chặn."); }
}
function saveCache() {
  if (!uid) return;
  try { localStorage.setItem(cacheKey(), JSON.stringify({ settings: S.settings, months: S.months, synced, pend, lastBackup: S.lastBackup || null })); } catch (e) {}
}
function loadCache() {
  try { const raw = localStorage.getItem(cacheKey()); if (!raw) return false; const d = JSON.parse(raw); S.settings = normalize(d.settings); S.months = d.months || {}; synced = d.synced || {}; pend = Object.assign({ up: {}, del: {}, settings: false }, d.pend || {}); S.lastBackup = d.lastBackup || null; return true; } catch (e) { return false; }
}

function saveSettings() {
  if (S.mode === "sync") { pend.settings = true; saveCache(); flushSoon(); }
  else lsSave();
}
function saveMonth() {
  if (S.mode === "sync") { diffTx(); saveCache(); flushSoon(); }
  else lsSave();
}
/* So sánh dữ liệu trên máy với bản đã đồng bộ để biết dòng nào cần gửi, dòng nào cần xóa */
function diffTx() {
  const cur = {};
  allTx().forEach(t => cur[t.id] = t);
  Object.keys(cur).forEach(id => {
    const j = stable(cur[id]);
    if (synced[id] !== j) { pend.up[id] = cur[id]; delete pend.del[id]; }
    else { delete pend.up[id]; delete pend.del[id]; }
  });
  Object.keys(pend.up).forEach(id => { if (!cur[id]) delete pend.up[id]; });
  Object.keys(synced).forEach(id => { if (!cur[id]) pend.del[id] = true; });
}

function setSync(state) { S.sync = state; renderSyncState(); }
function renderSyncState() {
  const n = pendCount();
  let txt = "", cls = "";
  if (S.mode !== "sync") txt = "";
  else if (S.sync === "offline") { txt = n ? `Chưa đồng bộ (${n})` : "Ngoại tuyến"; cls = "off"; }
  else if (S.sync === "syncing" || n) { txt = "Đang đồng bộ…"; cls = "busy"; }
  else { txt = "Đã đồng bộ"; cls = "ok"; }
  document.querySelectorAll(".sync-pill").forEach(el => { el.textContent = txt; el.className = "sync-pill " + cls; el.hidden = !txt; });
}
function flushSoon() { renderSyncState(); clearTimeout(flushTimer); flushTimer = setTimeout(flush, 400); }
async function flush() {
  if (flushing || !sb || !uid || S.mode !== "sync") return;
  if (!pendCount()) { if (S.sync !== "offline") setSync("ok"); return; }
  flushing = true; setSync("syncing");
  try {
    if (pend.settings) {
      const snap = stable(S.settings);
      const { error } = await sb.from("settings").upsert({ user_id: uid, data: S.settings, updated_at: new Date().toISOString() });
      if (error) throw error;
      if (stable(S.settings) === snap) pend.settings = false;
    }
    const ups = Object.values(pend.up);
    for (let i = 0; i < ups.length; i += 500) {
      const chunk = ups.slice(i, i + 500);
      const { error } = await sb.from("transactions").upsert(chunk.map(t => ({ id: t.id, user_id: uid, data: t, updated_at: new Date().toISOString() })));

    for (let i = 0; i < dels.length; i += 200) {
      const chunk = dels.slice(i, i + 200);
      const { error } = await sb.from("transactions").delete().in("id", chunk);
      if (error) throw error;
      chunk.forEach(id => { delete synced[id]; delete pend.del[id]; });
    }
    saveCache();
    flushing = false;
    if (pendCount()) return flush();
    setSync("ok");
  } catch (e) {
    flushing = false; saveCache(); setSync("offline");
    clearTimeout(retryTimer); retryTimer = setTimeout(flush, 15000);
  }

/* Tải toàn bộ dữ liệu của tài khoản từ máy chủ */
async function loadAll() {
  if (!sb || !uid) return;
  const st = await sb.from("settings").select("data").eq("user_id", uid).maybeSingle();
  if (st.error) throw st.error;
  let rows = [];
  for (let from = 0; ; from += 1000) {
    const r = await sb.from("transactions").select("id,data").order("id").range(from, from + 999);
    if (r.error) throw r.error;
    rows = rows.concat(r.data || []);
    if (!r.data || r.data.length < 1000) break;
  }
  lastLoad = Date.now();
  synced = {};
  const byId = {};
  rows.forEach(r => { const t = Object.assign({}, r.data, { id: r.id }); synced[r.id] = stable(t); byId[r.id] = t; });
  Object.values(pend.up).forEach(t => byId[t.id] = t);
  Object.keys(pend.del).forEach(id => delete byId[id]);
  const firstTime = S.mode === "loading";
  const serverEmpty = !st.data && !rows.length;
  if (firstTime && serverEmpty) {
    const local = readLocalData();
    S.mode = "sync";
    if (local) {
      S.settings = normalize(local.settings); S.months = {};
      render();
      confirmBox("Đưa dữ liệu lên tài khoản?", `Thiết bị này đang có ${local.n} giao dịch chưa thuộc tài khoản nào. Bạn có muốn đưa toàn bộ lên tài khoản để đồng bộ sang các thiết bị khác không?`, "Đưa lên", () => {
        S.months = JSON.parse(JSON.stringify(local.months)); pend.settings = true; diffTx(); saveCache(); render(); flush(); toast(`Đang tải ${local.n} giao dịch lên tài khoản`);
      }, () => { S.settings = defaults(); S.months = {}; pend.settings = true; saveCache(); render(); flush(); }, "Bắt đầu sổ mới");
      return;
    }
    S.settings = defaults(); pend.settings = true;
  } else if (st.data && !pend.settings) {
    S.settings = normalize(JSON.parse(JSON.stringify(st.data.data)));
    if (needsMigrate) { needsMigrate = false; pend.settings = true; }
  } else if (!st.data) pend.settings = true;
  const months = {};
  Object.values(byId).forEach(t => (months[t.date.slice(0, 7)] = months[t.date.slice(0, 7)] || []).push(t));

}
function readLocalData() {

    const n = Object.values(d.months || {}).reduce((a, m) => a + (Array.isArray(m) ? m.length : 0), 0);
    return n ? { settings: d.settings, months: d.months, n } : null;
  } catch (e) { return null; }
}

function applyRemoteTx(p) {
  if (p.eventType === "DELETE") {
    const id = p.old && p.old.id; if (!id || pend.up[id]) return;
    delete synced[id]; delete pend.del[id];
    Object.keys(S.months).forEach(k => { S.months[k] = S.months[k].filter(t => t.id !== id); if (!S.months[k].length) delete S.months[k]; });
  } else {
    const r = p.new; if (!r || !r.data || pend.up[r.id] || pend.del[r.id]) return;
    const t = Object.assign({}, r.data, { id: r.id });
    if (synced[r.id] === stable(t)) return;
    synced[r.id] = stable(t);
    Object.keys(S.months).forEach(k => { S.months[k] = S.months[k].filter(x => x.id !== r.id); if (!S.months[k].length) delete S.months[k]; });
    const m = t.date.slice(0, 7); (S.months[m] = S.months[m] || []).push(t);
  }
  saveCache(); renderSoon();
}
function applyRemoteSettings(p) {

}

function subscribe() {

  channel = sb.channel("so-chi-tieu-" + uid)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "transactions", filter: "user_id=eq." + uid }, applyRemoteTx)
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "transactions", filter: "user_id=eq." + uid }, applyRemoteTx)
    .on("postgres_changes", { event: "DELETE", schema: "public", table: "transactions" }, applyRemoteTx)
    .on("postgres_changes", { event: "*", schema: "public", table: "settings", filter: "user_id=eq." + uid }, applyRemoteSettings)

async function initStore() {

}

function normalize(d) {

function totals(key) {
  let inc = 0, exp = 0;
  monthTx(key).forEach(t => { if (t.type === "income") inc += t.amount; else if (t.type === "expense") exp += t.amount; });
  const li = loanInterestIn(key); inc += li.inc; exp += li.exp;
  return { inc, exp, net: inc - exp };
}
function walletBalances() {
  const bal = {};
  S.settings.wallets.forEach(w => bal[w.id] = Number(w.initial) || 0);
  allTx().forEach(t => {
    if (t.type === "income") bal[t.walletId] = (bal[t.walletId] || 0) + t.amount;
    else if (t.type === "expense") bal[t.walletId] = (bal[t.walletId] || 0) - t.amount;
    else if (t.type === "transfer") { bal[t.walletId] = (bal[t.walletId] || 0) - t.amount; bal[t.toWalletId] = (bal[t.toWalletId] || 0) + t.amount; }
  });
  funds().forEach(f => (f.entries || []).forEach(e => { if (e.walletId) bal[e.walletId] = (bal[e.walletId] || 0) - e.amount; }));
  loans().forEach(l => {
    const sg = l.kind === "borrow" ? 1 : -1;
    if (l.walletId) bal[l.walletId] = (bal[l.walletId] || 0) + sg * l.amount;
    (l.payments || []).forEach(p => { if (p.walletId) bal[p.walletId] = (bal[p.walletId] || 0) - sg * ((p.principal || 0) + (p.interest || 0)); });
  });
  return bal;
}
function spendByCat(keys) {
  const m = {};
  keys.forEach(k => { monthTx(k).forEach(t => { if (t.type === "expense") m[t.catId] = (m[t.catId] || 0) + t.amount; }); const li = loanInterestIn(k).exp; if (li) m._loanint = (m._loanint || 0) + li; });
  return m;
}
function incomeByCat(keys) {
  const m = {};
  keys.forEach(k => monthTx(k).forEach(t => { if (t.type === "income") m[t.catId] = (m[t.catId] || 0) + t.amount; }));
  return m;
}
const sortTx = arr => arr.slice().sort((a, b) => (b.date.localeCompare(a.date)) || ((b.createdAt || 0) - (a.createdAt || 0)));
function usage() {
  const w = new Set(), c = new Set();
  allTx().forEach(t => { w.add(t.walletId); if (t.toWalletId) w.add(t.toWalletId); if (t.catId) c.add(t.catId); });
  funds().forEach(f => { w.add(f.walletId); (f.entries || []).forEach(e => w.add(e.walletId)); });
  loans().forEach(l => { w.add(l.walletId); (l.payments || []).forEach(p => w.add(p.walletId)); });
  return { w, c };
}

const TESS_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";

function parseReceipt(text) {
  const lines = text.split(/\r?\n/).map(l => l.replace(/\s+/g, " ").trim()).filter(Boolean);
  const dateRe = /\b(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})\b|\b(\d{4})-(\d{2})-(\d{2})\b/g;
  const today = todayStr();
  let date = "";
  for (const l of lines) {
    let m; dateRe.lastIndex = 0;
    while ((m = dateRe.exec(l))) {
      let d, mo, y;
      if (m[4]) { y = +m[4]; mo = +m[5]; d = +m[6]; } else { d = +m[1]; mo = +m[2]; y = +m[3]; if (y < 100) y += 2000; }
      if (d >= 1 && d <= 31 && mo >= 1 && mo <= 12 && y >= 2000 && y <= 2100) { const ds = `${y}-${pad(mo)}-${pad(d)}`; if (ds <= today) { date = ds; break; } }
    }
    if (date) break;
    const vm = l.toLowerCase().match(/ngày\s*(\d{1,2})\s*tháng\s*(\d{1,2})\s*năm\s*(\d{4})/);
    if (vm) { const ds = `${vm[3]}-${pad(+vm[2])}-${pad(+vm[1])}`; if (ds <= today) { date = ds; break; } }
  }
  const KEY_STRONG = /(tổng\s*(cộng|tiền|thanh toán|số)|tong\s*(cong|tien)|thanh\s*toán|thanh\s*toan|cần thanh toán|phải trả|total|grand total|amount due|số tiền|so tien|thành tiền|thanh tien)/i;
  const KEY_WEAK = /(tiền|tien|cộng|cong|vnd|vnđ|đ\b|₫)/i;
  const KEY_BAD = /(tiền mặt|tien mat|khách đưa|khach dua|tiền thừa|tien thua|trả lại|tra lai|giảm giá|giam gia|chiết khấu|vat|thuế|mst|tax|sđt|sdt|điện thoại|hotline|stk|số tk|tài khoản|tai khoan|mã|ma gd|ref|số hđ|hóa đơn số)/i;
  const cands = [];
  lines.forEach((l, idx) => {
    const clean = l.replace(dateRe, " ").replace(/\b\d{1,2}:\d{2}(:\d{2})?\b/g, " ");
    const numRe = /(\d{1,3}(?:[.,\s]\d{3})+|\d{4,})(?:[.,]\d{1,2}(?!\d))?/g;
    let m;
    while ((m = numRe.exec(clean))) {
      const raw = m[1];
      const grouped = /[.,\s]\d{3}/.test(raw);
      const digits = raw.replace(/[.,\s]/g, "");
      if (!grouped && (digits.length > 9 || /^0\d{8,}/.test(digits))) continue;
      const v = parseInt(digits, 10);
      if (!(v >= 1000 && v <= 2e9)) continue;
      let score = 0;
      if (KEY_STRONG.test(l)) score += 6;
      else if (KEY_WEAK.test(l)) score += 1;
      if (KEY_BAD.test(l)) score -= 5;
      if (/(đ|₫|vnd|vnđ)/i.test(l)) score += 2;
      if (grouped) score += 1;
      if (idx > 0 && KEY_STRONG.test(lines[idx - 1]) && !/\d{3}/.test(lines[idx - 1])) score += 4;
      cands.push({ v, score, idx });
    }
  });
  const best = {};
  cands.forEach(c => { if (!best[c.v] || best[c.v].score < c.score) best[c.v] = c; });
  const ranked = Object.values(best).sort((a, b) => b.score - a.score || b.v - a.v);
  let merchant = "";
  for (const l of lines.slice(0, 6)) {
    const letters = (l.match(/\p{L}/gu) || []).length;
    if (letters >= 4 && letters / l.length > 0.5 && !/(hóa đơn|hoa don|phiếu|receipt|bill|invoice|chuyển tiền|giao dịch)/i.test(l)) { merchant = l.slice(0, 40); break; }
  }
  for (const l of lines) { const m = l.match(/^(nội dung|noi dung|lời nhắn|loi nhan|message|content)\s*:?\s*(.{3,})$/i); if (m) { merchant = m[2].trim().slice(0, 60); break; } }
  return { amount: ranked[0]?.v || 0, options: ranked.slice(0, 5).map(c => c.v), date, merchant, text, bestLine: ranked[0] ? lines[ranked[0].idx] : "" };
}

/* ---------- Lịch thu chi ---------- */

/* ---------- Ngân sách: mỗi tháng một con số riêng ---------- */

function budAll() { return S.settings.mbudget || (S.settings.mbudget = {}); }

}

    <text x="65" y="82" text-anchor="middle" style="font:12px var(--font-body);fill:var(--muted)">đã dùng</text></svg>`;
}

/* Chi theo tuần trong tháng so với mức cho phép mỗi tuần */

  const weeks = []; for (let s = 1; s <= nd; s += 7) { const e = Math.min(nd, s + 6); let sp = 0; for (let d = s; d <= e; d++) sp += byDay[d]; weeks.push({ s, e, sp, lim: b.limit ? b.limit / nd * (e - s + 1) : 0 }); }

  return `<div class="card"><div class="card-h"><h2>Chi theo tuần</h2>${b.limit ? `<span class="hint">Mức cho phép ~${fmt(Math.round(b.limit / nd * 7 / 1000) * 1000)}/tuần</span>` : ""}</div>

  const keys = []; for (let i = 11; i >= 0; i--) keys.push(shiftMonth(anchor, -i));

    const [y, m] = d.k.split("-");
    return `<button type="button" class="ms-card" data-act="cmp-pick" data-v="${d.k}" aria-pressed="${d.k === S.month && !rangeOn()}" title="${monthLabel(d.k)}: chi ${fmt(d.exp)}, thu ${fmt(d.inc)}">

function guessCategory(text, type) {

    const generic = /^(hoa don|khac|thu khac|chi khac|tien)$/.test(nm);
    if (!generic && nm.length >= 3 && t.includes(" " + nm)) { score += 3; hit = c.name; }

/* ---------- So sánh với tháng trước (cùng kỳ) ---------- */

    <div class="cmp2-top"><div><div class="hint">${monthShort(k)}</div><div class="cmp2-v">${fmt(a.exp)}</div></div><div class="cmp2-vs">so với</div><div><div class="hint">${monthShort(pk)}</div><div class="cmp2-v muted">${fmt(b.exp)}</div></div></div>
    <div style="margin:8px 0 4px">${verdict}${avg ? `<span class="hint" style="margin-left:8px">Trung bình 3 tháng: ${fmt(avg)}</span>` : ""}</div>
    <div class="cmp2-legend"><span><i class="now"></i>${monthShort(k)}</span><span><i class="prev"></i>${monthShort(pk)}</span></div>
    ${rows.map(r => { const d = r.x - r.y; return `<div class="cmp2-row">${catBadge(r.id, "sm")}<div class="cmp2-mid"><div class="cmp2-name"><span>${esc(catName(r.id))}</span><b class="num">${fmtNum(r.x)}</b></div>
      <div class="cmp2-bars"><i class="now" style="width:${r.x / mx * 100}%"></i><i class="prev" style="width:${r.y / mx * 100}%"></i></div></div>
      <span class="cmp2-d ${d > 0 ? "up" : d < 0 ? "down" : ""}">${d === 0 ? "=" : (d > 0 ? "+" : "−") + fmtNum(Math.abs(d))}</span></div>`; }).join("")}</div>`;
}

/* ---------- Vay: lãi suất và kế hoạch trả ---------- */
const RATE_TYPES = [["none", "Không lãi"], ["day", "%/ngày"], ["month", "%/tháng"], ["year", "%/năm"], ["float", "Thả nổi %/năm"]];
const PAY_METHODS = [["end", "Trả một lần khi đến hạn", "Gốc + lãi trả gọn vào ngày đến hạn"], ["principal", "Trả góp, gốc đều", "Mỗi tháng trả gốc bằng nhau + lãi trên dư nợ còn lại (giảm dần)"], ["annuity", "Trả góp, số tiền đều", "Mỗi tháng trả một số tiền như nhau (gồm cả gốc và lãi)"]];

/* Còn thiếu bao nhiêu, còn mấy ngày, mỗi ngày cần nạp bao nhiêu */
function fundNeed(f) {
  const bal = fundBal(f), left = Math.max(0, (f.target || 0) - bal);
  if (!f.target || !left) return { left: 0, days: 0, perDay: 0, late: false };
  if (!f.deadline) return { left, days: 0, perDay: 0, late: false };
  const days = daysBetween(todayStr(), f.deadline) + 1; // tính cả hôm nay
  if (days <= 0) return { left, days: 0, perDay: 0, late: true };
  return { left, days, perDay: Math.ceil(left / days / 1000) * 1000, late: false };
}

/* ---------- Bật/tắt: xem tổng cần trả/nạp hoặc chỉ tháng này ---------- */
const monthEnd = key => { const [y, m] = key.split("-").map(Number); return `${key}-${pad(new Date(y, m, 0).getDate())}`; };
// Số phải trả (hoặc thu) của khoản vay tính đến hết tháng này, gồm cả kỳ đã quá hạn
function loanDueThisMonth(l) {
  const rem = loanRemaining(l); if (rem <= 0) return 0;
  const p = loanPlan(l); if (!p || !p.schedule.length) return 0;
  const end = monthEnd(todayStr().slice(0, 7));
  const sched = p.schedule.filter(x => x.date <= end).reduce((a, x) => a + x.pay, 0);
  return Math.max(0, Math.min(rem, sched - loanPaidAll(l)));
}
// Số cần nạp vào quỹ trong phần còn lại của tháng này để kịp hạn
function fundDueThisMonth(f) {
  const n = fundNeed(f); if (!n.left) return 0;
  if (n.late) return n.left;
  if (!n.perDay) return 0;
  const end = monthEnd(todayStr().slice(0, 7)), stop = f.deadline < end ? f.deadline : end;
  return Math.min(n.left, n.perDay * (daysBetween(todayStr(), stop) + 1));
}

function catEntries(sp) {

function donutHtml(entries, total, centerLabel) {
  const R = 62, SW = 24, C = 2 * Math.PI * R, gap = entries.length > 1 ? 2.5 : 0;

  entries.forEach(e => {
    const len = e.val / total * C, dl = Math.max(0.8, len - gap);
    const k = tipReg(`<div class="h">${esc(e.label)}</div>` + tipRow(e.color, "Đã chi", fmt(e.val)) + tipRow("", "Tỷ trọng", (e.val / total * 100).toFixed(1).replace(".", ",") + "%"));
    s += `<circle class="seg-arc" data-tip="${k}" cx="85" cy="85" r="${R}" fill="none" stroke="${e.color}" stroke-width="${SW}" stroke-dasharray="${dl} ${C}" stroke-dashoffset="${-off}"/>`;
    off += len;
  });
  s += `</g><text x="85" y="79" text-anchor="middle" style="fill:var(--muted);font-size:11px;font-family:var(--font-body)">${centerLabel}</text><text x="85" y="101" text-anchor="middle" style="fill:var(--ink);font-size:${total >= 1e8 ? 14 : 17}px;font-weight:600;font-family:var(--font-display)">${fmtNum(total)}</text></svg>`;

/* Còn bao nhiêu để chi trong tháng và chia đều cho những ngày còn lại */
function dayAllowance(key) {
  const [y, m] = key.split("-").map(Number), nd = new Date(y, m, 0).getDate(), cur = todayStr().slice(0, 7);
  const t = totals(key), lim = budOf(key).total, src = lim ? "ngân sách" : "thu nhập";
  const base = lim || t.inc;
  if (!base) return null;
  const left = base - t.exp;
  const days = key === cur ? nd - +todayStr().slice(8) + 1 : key > cur ? nd : 0;
  return { left, days, src, per: days && left > 0 ? Math.floor(left / days / 1000) * 1000 : 0 };
}
function dailyChart(key) {
  const [y, m] = key.split("-").map(Number), nd = new Date(y, m, 0).getDate();
  const arr = Array(nd).fill(0), cnt = Array(nd).fill(0);
  monthTx(key).forEach(t => { if (t.type === "expense") { const d = +t.date.slice(8) - 1; arr[d] += t.amount; cnt[d]++; } });
  const max = Math.max(...arr);
  if (!max) return { html: `<p class="hint">Chưa có khoản chi nào trong tháng này.</p>`, avg: 0 };
  const today = todayStr(), cur = today.slice(0, 7);
  const elapsed = key === cur ? +today.slice(8) : key < cur ? nd : 0;
  const al = dayAllowance(key), avg = al && al.per ? al.per : 0; // vạch đứt = mức được chi mỗi ngày từ nay đến cuối tháng
  const max2 = Math.max(max, avg);
  const W = 680, H = 180, pl = 92, pr = 6, pt = 8, pb = 24;
  const step = niceStep(max2 / 3), top = Math.ceil(max2 / step) * step;
  const ih = H - pt - pb, yy = v => pt + ih * (1 - v / top), base = yy(0);
  const cw = (W - pl - pr) / nd, bw = Math.max(3, cw - 4);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chi tiêu theo ngày">`;
  for (let v = 0; v <= top + 1e-6; v += step) s += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${yy(v)}" y2="${yy(v)}"/><text class="ax" x="${pl - 8}" y="${yy(v) + 4}" text-anchor="end">${v ? fmtShort(v) : "0"}</text>`;
  arr.forEach((v, i) => {
    const x = pl + cw * i + (cw - bw) / 2;
    const isToday = key === cur && i + 1 === +today.slice(8);
    if (v) s += `<path d="${barPath(x, base, bw, base - yy(v))}" fill="var(--exp)" ${v > avg * 1.8 && avg ? "" : 'fill-opacity="0.78"'}/>`;
    if (i === 0 || (i + 1) % 5 === 0 || i === nd - 1 || isToday) s += `<text class="ax" x="${x + bw / 2}" y="${H - 7}" text-anchor="middle" ${isToday ? 'style="font-weight:700;fill:var(--ink)"' : ""}>${i + 1}</text>`;
  });
  if (avg) s += `<line x1="${pl}" x2="${W - pr}" y1="${yy(avg)}" y2="${yy(avg)}" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  s += `<line class="base" x1="${pl}" x2="${W - pr}" y1="${base}" y2="${base}"/>`;
  arr.forEach((v, i) => {
    const k = tipReg(`<div class="h">Ngày ${pad(i + 1)}/${pad(m)}</div>` + tipRow("var(--exp)", "Chi tiêu", fmt(v)) + tipRow("", "Số giao dịch", cnt[i]) + (avg ? tipRow("", "So với mức/ngày", (v >= avg ? "+" : "−") + fmtShort(Math.abs(v - avg))) : ""));
    s += `<rect class="hit" data-tip="${k}" x="${pl + cw * i}" y="${pt}" width="${cw}" height="${ih}"/>`;
  });
  s += `</svg>`;
  return { html: `<div class="chart-wrap">${s}</div>`, avg };
}

function viewOverview() {

/* ---------- Giao dịch ---------- */
function inRange(d) { const f = S.f; if (f.from && d < f.from) return false; if (f.to && d > f.to) return false; return true; }
const rangeOn = () => !!(S.f.from || S.f.to);
function baseRows() {
  const useRange = rangeOn();
  const real = useRange ? allTx().filter(t => inRange(t.date)) : monthTx(S.month);
  const virt = virtualRows().filter(r => useRange ? inRange(r.date) : r.date.slice(0, 7) === S.month);
  return { real, virt };
}
function filteredTx() {
  const f = S.f, q = f.q.trim().toLowerCase();
  const { real, virt } = baseRows();
  const isV = f.type === "fund" || f.type === "loan";
  const r = isV ? [] : real.filter(t => {
    if (f.type !== "all" && t.type !== f.type) return false;
    if (f.cat && t.catId !== f.cat) return false;
    if (f.wallet && t.walletId !== f.wallet && t.toWalletId !== f.wallet) return false;
    if (q) { const hay = [t.note, catName(t.catId), walletName(t.walletId), String(t.amount), fmtDate(t.date)].join(" ").toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  });
  const v = (f.type === "all" || isV) && !f.cat ? virt.filter(x => {
    if (isV && x.v !== f.type) return false;
    if (f.wallet && x.walletId !== f.wallet) return false;
    if (q) { const hay = [x.title, x.note, x.sub, String(x.amount), fmtDate(x.date)].join(" ").toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  }) : [];
  return sortTx(r.concat(v));
}
function txListHtml() {
  const list = filteredTx();
  const { real, virt } = baseRows();
  if (!real.length && !virt.length) return rangeOn() ? `<div class="empty"><p>Không có giao dịch nào trong khoảng ngày đã chọn.</p><button class="btn" type="button" data-act="clear-filter">Xóa bộ lọc</button></div>` : emptyTx("Chưa có giao dịch nào trong " + monthLabel(S.month).toLowerCase() + ".");
  if (!list.length) return `<div class="empty"><p>Không có giao dịch khớp bộ lọc.</p><button class="btn" type="button" data-act="clear-filter">Xóa bộ lọc</button></div>`;
  let inc = 0, exp = 0;
  list.forEach(t => { if (t.v) return; if (t.type === "income") inc += t.amount; else if (t.type === "expense") exp += t.amount; });
  const groups = {};
  list.forEach(t => (groups[t.date] = groups[t.date] || []).push(t));
  const showYear = rangeOn() && Object.keys(groups).some(d => d.slice(0, 4) !== todayStr().slice(0, 4));
  return `<div class="sum-line"><span>${list.length} giao dịch</span><span>Thu <b>${fmt(inc)}</b></span><span>Chi <b>${fmt(exp)}</b></span></div>` +
    Object.keys(groups).map(d => {
      const dayExp = groups[d].reduce((a, t) => a + (!t.v && t.type === "expense" ? t.amount : 0), 0);
      return `<div class="day"><div class="day-h"><b>${dayLabel(d)}${showYear ? "/" + d.slice(0, 4) : ""}</b><span class="num">${dayExp ? "Chi " + fmt(dayExp) : ""}</span></div>${groups[d].map(t => t.v ? vRow(t) : txRow(t)).join("")}</div>`;
    }).join("");
}
function quickRange(k) {
  const t = todayStr(), d = new Date();
  const back = n => { const x = new Date(); x.setDate(x.getDate() - n); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`; };
  if (k === "today") return [t, t];
  if (k === "yesterday") { const y = back(1); return [y, y]; }
  if (k === "7d") return [back(6), t];
  if (k === "30d") return [back(29), t];
  if (k === "year") return [`${d.getFullYear()}-01-01`, t];
  return ["", ""];
}
function viewTx() {
  const f = S.f;
  const nF = (f.cat ? 1 : 0) + (f.wallet ? 1 : 0) + (rangeOn() ? 1 : 0);
  const typeBtn = (v, l) => `<button type="button" data-act="ftype" data-v="${v}" aria-pressed="${f.type === v}">${l}</button>`;
  const catOpts = `<option value="">Mọi danh mục</option>` + S.settings.categories.map(c => `<option value="${esc(c.id)}" ${f.cat === c.id ? "selected" : ""}>${esc(c.name)}${c.type === "income" ? " (thu)" : ""}</option>`).join("");
  const wOpts = `<option value="">Mọi ví</option>` + S.settings.wallets.map(w => `<option value="${esc(w.id)}" ${f.wallet === w.id ? "selected" : ""}>${esc(w.name)}</option>`).join("");
  const filterPanel = S.showFilters ? `<div class="fpanel">
      <div class="fp-row"><select id="f-cat" aria-label="Lọc danh mục">${catOpts}</select><select id="f-wallet" aria-label="Lọc ví">${wOpts}</select></div>
      <div class="fp-row"><div class="df-field"><span>Từ</span>${dateField("f-from", f.from || "", { clear: true, placeholder: "Từ ngày", label: "Từ ngày" })}</div><div class="df-field"><span>Đến</span>${dateField("f-to", f.to || "", { clear: true, placeholder: "Đến ngày", label: "Đến ngày" })}</div></div>
      ${nF ? `<button class="btn sm ghost" type="button" data-act="clear-filter" style="align-self:flex-start">Xóa bộ lọc</button>` : ""}</div>` : "";
  const rangeNote = rangeOn() ? `<div class="rnote">Đang xem ${f.from && f.to && f.from === f.to ? "ngày " + fmtDate(f.from) : (f.from ? "từ " + fmtDate(f.from) + " " : "") + (f.to ? "đến " + fmtDate(f.to) : "")}<button type="button" data-act="frange" data-v="clear" aria-label="Bỏ lọc ngày">✕</button></div>` : "";
  const funnel = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>';
  const bars = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
  return sectionsPage("giao-dich", sb => topbar("Giao dịch", true, sb), { compare: () => `<div class="card"><div class="card-h" style="margin-bottom:6px"><h2>So sánh chi tiêu các tháng</h2><span class="hint">Bấm để xem tháng</span></div>${monthStrip()}</div>`, list: () => `<div class="card">
    <div class="tx-tools"><input id="f-q" type="search" placeholder="Tìm giao dịch…" value="${esc(f.q)}" aria-label="Tìm kiếm">
      <button type="button" class="tool-btn" data-act="tog-filters" aria-pressed="${!!S.showFilters}" title="Bộ lọc">${funnel}<span>Bộ lọc</span>${nF ? `<b class="nbadge">${nF}</b>` : ""}</button>
</div>
    ${filterPanel}
    <div class="seg scroll" style="margin:8px 0 2px">${typeBtn("all", "Tất cả")}${typeBtn("expense", "Chi")}${typeBtn("income", "Thu")}${typeBtn("fund", "Quỹ tiết kiệm")}${typeBtn("loan", "Vay")}</div>
    ${rangeNote}
    <div id="tx-list">${txListHtml()}</div></div>` }, { compare: () => "Chi tháng này " + fmt(totals(S.month).exp), list: () => monthTx(S.month).length + " giao dịch" });
}

/* ---------- Ngân sách ---------- */
/* ---------- Báo cáo ---------- */
function niceStep(x) { if (!(x > 0)) return 1; const e = Math.floor(Math.log10(x)); const f = x / 10 ** e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * 10 ** e; }
function barPath(x, base, w, h) {
  if (h <= 0) return "";
  const r = Math.min(4, w / 2, h);
  return `M${x},${base}V${base - h + r}Q${x},${base - h} ${x + r},${base - h}H${x + w - r}Q${x + w},${base - h} ${x + w},${base - h + r}V${base}Z`;
}
function axisY(s, lo, hi, step, yy, pl, W, pr, f) {
  f = f || fmtNum;
  for (let v = lo; v <= hi + 1e-6; v += step) {
    const vv = Math.abs(v) < 1e-6 ? 0 : v;
    s.push(`<line class="gl" x1="${pl}" x2="${W - pr}" y1="${yy(vv)}" y2="${yy(vv)}"/><text class="ax" x="${pl - 8}" y="${yy(vv) + 4}" text-anchor="end">${vv ? (vv < 0 ? "−" : "") + f(Math.abs(vv)) : "0"}</text>`);
  }
}
const xLabel = (k, x, H) => `<text class="ax" x="${x}" y="${H - 8}" text-anchor="middle" ${k === S.month ? 'style="font-weight:700;fill:var(--ink)"' : ""}>${monthShort(k)}</text>`;

function monthChart(keys) {
  const data = keys.map(k => ({ k, ...totals(k) }));
  const W = 680, H = 250, pl = 92, pr = 6, pt = 10, pb = 28;
  const max = Math.max(...data.map(d => Math.max(d.inc, d.exp)));
  if (!max) return `<p class="hint">Chưa có dữ liệu trong khoảng thời gian này.</p>`;
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const ih = H - pt - pb, y = v => pt + ih * (1 - v / top), base = y(0);
  const cw = (W - pl - pr) / data.length, bw = Math.max(4, Math.min(26, (cw - 14) / 2));
  const s = [`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Thu và chi theo tháng">`];
  axisY(s, 0, top, step, y, pl, W, pr);
  data.forEach((d, i) => {
    const cx = pl + cw * i + cw / 2;
    s.push(`<path d="${barPath(cx - bw - 1, base, bw, base - y(d.inc))}" fill="var(--inc)"/><path d="${barPath(cx + 1, base, bw, base - y(d.exp))}" fill="var(--exp)"/>`, xLabel(d.k, cx, H));
  });
  s.push(`<line class="base" x1="${pl}" x2="${W - pr}" y1="${base}" y2="${base}"/>`);
  data.forEach((d, i) => {
    const k = tipReg(`<div class="h">${monthLabel(d.k)}</div>` + tipRow("var(--inc)", "Thu", fmt(d.inc)) + tipRow("var(--exp)", "Chi", fmt(d.exp)) + `<div style="margin-top:3px">` + tipRow("", "Chênh lệch", (d.net < 0 ? "−" : "") + fmt(Math.abs(d.net))) + `</div>`);
    s.push(`<rect class="hit" data-tip="${k}" x="${pl + cw * i}" y="${pt}" width="${cw}" height="${ih}"/>`);
  });
  s.push(`</svg>`);
  return `<div class="legend"><span><i style="background:var(--inc)"></i>Thu nhập</span><span><i style="background:var(--exp)"></i>Chi tiêu</span></div><div class="chart-wrap">${s.join("")}</div>`;
}

function stackChart(keys) {
  const sp = spendByCat(keys);
  const ranked = Object.entries(sp).filter(r => r[1] > 0).sort((a, b) => b[1] - a[1]).map(r => r[0]);
  if (!ranked.length) return `<p class="hint">Chưa có khoản chi nào trong khoảng thời gian này.</p>`;
  const hasRest = ranked.length > 7;
  const topIds = hasRest ? ranked.filter(id => catIcon(id) !== "dots").slice(0, 6) : ranked;
  const series = topIds.map(id => ({ id, label: catName(id), color: catColor(id) }));
  if (hasRest) series.push({ id: "_rest", label: "Khác & còn lại", color: "var(--c0)" });
  const data = keys.map(k => {
    const m = spendByCat([k]); const vals = {};
    let rest = 0;
    Object.entries(m).forEach(([id, v]) => { if (topIds.includes(id)) vals[id] = v; else rest += v; });
    if (hasRest) vals._rest = rest;
    return { k, vals, total: Object.values(m).reduce((a, b) => a + b, 0) };
  });
  const W = 680, H = 250, pl = 92, pr = 6, pt = 10, pb = 28;
  const max = Math.max(...data.map(d => d.total));
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const ih = H - pt - pb, y = v => pt + ih * (1 - v / top), base = y(0);
  const cw = (W - pl - pr) / data.length, bw = Math.max(8, Math.min(40, cw * 0.56));
  const s = [`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cơ cấu chi theo tháng">`];
  axisY(s, 0, top, step, y, pl, W, pr);
  data.forEach((d, i) => {
    const x = pl + cw * i + (cw - bw) / 2;
    let acc = 0;
    const segs = series.filter(se => d.vals[se.id] > 0);
    segs.forEach((se, j) => {
      const v = d.vals[se.id], y0 = y(acc), y1 = y(acc + v), h = y0 - y1;
      const last = j === segs.length - 1;
      if (last) s.push(`<path d="${barPath(x, y0, bw, h)}" fill="${se.color}"/>`);
      else s.push(`<rect x="${x}" y="${y1 + (h > 3 ? 2 : 0)}" width="${bw}" height="${Math.max(0.5, h - (h > 3 ? 2 : 0))}" fill="${se.color}"/>`);
      acc += v;
    });
    s.push(xLabel(d.k, x + bw / 2, H));
  });
  s.push(`<line class="base" x1="${pl}" x2="${W - pr}" y1="${base}" y2="${base}"/>`);
  data.forEach((d, i) => {
    const rows = series.filter(se => d.vals[se.id] > 0).sort((a, b) => d.vals[b.id] - d.vals[a.id]).map(se => tipRow(se.color, se.label, fmt(d.vals[se.id]))).join("");
    const k = tipReg(`<div class="h">${monthLabel(d.k)} · ${fmt(d.total)}</div>` + (rows || `<div class="r">Không có khoản chi</div>`));
    s.push(`<rect class="hit" data-tip="${k}" x="${pl + cw * i}" y="${pt}" width="${cw}" height="${ih}"/>`);
  });
  s.push(`</svg>`);
  const legend = series.map(se => `<span><i style="background:${se.color}"></i>${esc(se.label)}</span>`).join("");
  return `<div class="legend wrap">${legend}</div><div class="chart-wrap">${s.join("")}</div>`;
}

function balanceChart(keys) {
  const init = S.settings.wallets.reduce((a, w) => a + (Number(w.initial) || 0), 0);
  const all = allTx();
  const data = keys.map(k => {
    let v = init;
    all.forEach(t => { if (t.date.slice(0, 7) <= k) { if (t.type === "income") v += t.amount; else if (t.type === "expense") v -= t.amount; } });
    funds().forEach(f => (f.entries || []).forEach(e => { if (e.walletId && e.date.slice(0, 7) <= k) v -= e.amount; }));
    loans().forEach(l => { const sg = l.kind === "borrow" ? 1 : -1; if (l.walletId && l.date.slice(0, 7) <= k) v += sg * l.amount; (l.payments || []).forEach(p => { if (p.walletId && p.date.slice(0, 7) <= k) v -= sg * ((p.principal || 0) + (p.interest || 0)); }); });
    return { k, v };
  });
  const vals = data.map(d => d.v);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (lo === hi) hi = lo + 1e6;
  const step = niceStep((hi - lo) / 4);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const W = 680, H = 220, pl = 92, pr = 14, pt = 14, pb = 28;
  const ih = H - pt - pb, y = v => pt + ih * (1 - (v - lo) / (hi - lo));
  const cw = (W - pl - pr) / data.length, xs = data.map((d, i) => pl + cw * i + cw / 2);
  const s = [`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tổng số dư cuối mỗi tháng"><defs><linearGradient id="balg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--c1)" stop-opacity="0.28"/><stop offset="1" stop-color="var(--c1)" stop-opacity="0"/></linearGradient></defs>`];
  axisY(s, lo, hi, step, y, pl, W, pr);
  const line = data.map((d, i) => `${i ? "L" : "M"}${xs[i]},${y(d.v)}`).join("");
  const floor = y(Math.max(lo, 0));
  s.push(`<path d="${line}L${xs[xs.length - 1]},${floor}L${xs[0]},${floor}Z" fill="url(#balg)"/>`);
  s.push(`<path d="${line}" fill="none" stroke="var(--c1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`);
  data.forEach((d, i) => {
    const last = i === data.length - 1;
    s.push(`<circle cx="${xs[i]}" cy="${y(d.v)}" r="${last ? 5.5 : 4}" fill="var(--c1)" stroke="var(--surface)" stroke-width="2"/>`, xLabel(d.k, xs[i], H));
  });
  const lastD = data[data.length - 1];
  s.push(`<text x="${xs[xs.length - 1]}" y="${y(lastD.v) - 12}" text-anchor="end" style="fill:var(--ink);font-size:12px;font-weight:600;font-family:var(--font-body)">${lastD.v < 0 ? "−" : ""}${fmtNum(Math.abs(lastD.v))}</text>`);
  data.forEach((d, i) => {

    const k = tipReg(`<div class="h">Cuối ${monthLabel(d.k).toLowerCase()}</div>` + tipRow("var(--c1)", "Tổng số dư", (d.v < 0 ? "−" : "") + fmt(Math.abs(d.v))) + (prev !== null ? tipRow("", "Thay đổi", (d.v - prev >= 0 ? "+" : "−") + fmt(Math.abs(d.v - prev))) : ""));
    s.push(`<rect class="hit" data-tip="${k}" x="${pl + cw * i}" y="${pt}" width="${cw}" height="${ih}"/>`);
  });
  s.push(`</svg>`);
  return `<div class="chart-wrap">${s.join("")}</div>`;
}

/* Số đầy đủ (1.000.000) có thể dài: tự thu nhỏ chữ để vừa một dòng thay vì xuống dòng */
function fitNums(root) {
  (root || document).querySelectorAll(".tile .v, .ms-v, .lr-right .num, .fit").forEach(el => {
    el.style.fontSize = "";
    let fs = parseFloat(getComputedStyle(el).fontSize), n = 0;
    const min = el.classList.contains("cal-i") || el.classList.contains("cal-e") ? 7 : 9;
    while (el.scrollWidth > el.clientWidth + 1 && fs > min && n++ < 30) { fs -= 0.5; el.style.fontSize = fs + "px"; }
  });
}
let fitT; addEventListener("resize", () => { clearTimeout(fitT); fitT = setTimeout(() => fitNums(), 150); });

function collect() {
  if (!M) return;
  const a = $("#m-amt"); if (a) M.amount = parseAmount(a.value);
  const w = $("#m-w"); if (w) M.walletId = w.value;
  const w2 = $("#m-w2"); if (w2) M.toWalletId = w2.value;
  const d = $("#m-date"); if (d) M.date = d.value;
  const n = $("#m-note"); if (n) M.note = n.value.trim();
  const r = $("#m-rep"); if (r) M.repeat = r.value;
}
function save(again) {
  collect();
  const t = M, err = $("#m-err");
  if (!t.amount) { err.textContent = "Nhập số tiền lớn hơn 0."; $("#m-amt").focus(); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(t.date || "")) { err.textContent = "Chọn ngày hợp lệ."; return; }
  if (t.type === "transfer") { if (!t.toWalletId || t.toWalletId === t.walletId) { err.textContent = "Chọn hai ví khác nhau để chuyển tiền."; return; } }
  else if (!t.catId) { err.textContent = "Chọn danh mục."; return; }
  let rule = null;
  if (!t.isEdit && t.repeat) {
    rule = { id: newId(), type: t.type, amount: t.amount, walletId: t.walletId, note: t.note || "", freq: t.repeat, start: t.date, skip: [] };
    if (t.type === "transfer") rule.toWalletId = t.toWalletId; else rule.catId = t.catId;
    recs().push(rule); saveSettings();
  }
  const rec = { id: rule ? recTxId(rule, t.date) : t.id || newId(), type: t.type, amount: t.amount, walletId: t.walletId, date: t.date, note: t.note || "", createdAt: t.createdAt || Date.now() };
  if (t.type === "transfer") rec.toWalletId = t.toWalletId; else rec.catId = t.catId;
  if (rule) rec.rec = rule.id; else if (t.rec) rec.rec = t.rec;
  const newM = rec.date.slice(0, 7), oldM = t.origMonth, isEdit = t.isEdit;
  if (isEdit) {
    S.months[oldM] = (S.months[oldM] || []).filter(x => x.id !== rec.id);
    if (oldM !== newM) saveMonth(oldM);
  }
  (S.months[newM] = S.months[newM] || []).push(rec);
  saveMonth(newM);
  closeModal();
  if (!isEdit && newM !== S.month && S.view !== "lich") S.month = newM;
  if (rule) runRecurring(true);
  render();
  toast(isEdit ? "Đã cập nhật" : "Đã thêm " + (rec.type === "income" ? "khoản thu " : rec.type === "expense" ? "khoản chi " : "chuyển khoản ") + fmt(rec.amount) + (rule ? " · " + FREQS[rule.freq].toLowerCase() : ""));
  if (again) openTx(null, rec.date, { type: rec.type, catId: rec.catId, walletId: rec.walletId, toWalletId: rec.toWalletId });
}
function removeTx(id, m) {
  const t = (S.months[m] || []).find(x => x.id === id);
  if (t && t.rec) { const r = recs().find(x => x.id === t.rec); if (r) { const d = id.slice(("rc-" + r.id + "-").length) || t.date; r.skip = [...new Set([...(r.skip || []), d])]; saveSettings(); } }
  S.months[m] = (S.months[m] || []).filter(x => x.id !== id);
  saveMonth(m); render();
}

function buildCsv() {
  const rows = [["Ngày", "Loại", "Số tiền", "Danh mục", "Ví", "Đến ví", "Ghi chú"]];
  const typeName = { expense: "Chi", income: "Thu", transfer: "Chuyển khoản" };
  sortTx(allTx()).reverse().forEach(t => rows.push([t.date, typeName[t.type], t.amount, t.catId ? catName(t.catId) : "", walletName(t.walletId), t.toWalletId ? walletName(t.toWalletId) : "", t.note || ""]));
  return { csv: rows.map(r => r.map(v => { const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(",")).join("\n"), n: rows.length - 1 };
}
function downloadFile(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type: type + ";charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
document.addEventListener("change", e => {
  if (e.target.id !== "restore-file" || !e.target.files[0]) return;
  const file = e.target.files[0]; e.target.value = "";
  file.text().then(txt => {
    let d; try { d = JSON.parse(txt); } catch (err) { toast("File không đúng định dạng sao lưu."); return; }
    if (!d || d.app !== "so-chi-tieu" || !d.settings || typeof d.months !== "object") { toast("Đây không phải file sao lưu của Sổ Chi Tiêu."); return; }
    const n = Object.values(d.months).reduce((a, m) => a + (Array.isArray(m) ? m.length : 0), 0);
    confirmBox("Khôi phục dữ liệu?", `File sao lưu ngày ${esc(fmtDate(isoDay(d.exportedAt)))} có ${n} giao dịch. Dữ liệu hiện có trên thiết bị này sẽ được thay thế hoàn toàn.`, "Khôi phục", () => {
      S.settings = normalize(d.settings); S.months = d.months; S.lastBackup = Date.now(); saveSettings(); saveMonth(); render(); toast(`Đã khôi phục ${n} giao dịch`);
    });
  });
});
document.addEventListener("click", e => {
  if (S.mp && !e.target.closest(".mp-wrap")) {
    S.mp = null;
    if (e.target.closest('[data-act="mp-today"]')) return;
    e.stopPropagation(); e.preventDefault(); render();
  }
}, true);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.mp) { S.mp = null; render(); }
  if (e.key === "Escape") closeMenu();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const fn = actions[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener("change", e => { if (e.target.id === "scan-file" && e.target.files[0]) { const f = e.target.files[0]; e.target.value = ""; startScan(f); } });
document.addEventListener("paste", e => {
  if (!S.settings || document.body.classList.contains("auth-mode")) return;
  if (e.target.matches && e.target.matches("input, textarea")) return;
  const it = [...((e.clipboardData && e.clipboardData.items) || [])].find(i => i.type.startsWith("image/"));
  if (it) { e.preventDefault(); closeModal(); startScan(it.getAsFile()); }
});
document.addEventListener("input", e => {
  if (e.target.id === "sc-amt" || e.target.id === "bud-total") formatAmountInput(e.target);
  if (e.target.matches && e.target.matches("[data-winit]")) {
    formatSignedInput(e.target);
    // Lưu ngay khi gõ (iPhone không phải lúc nào cũng báo "change" khi rời ô)
    const inp = e.target; clearTimeout(inp._t);
    inp._t = setTimeout(() => { const w = walletById(inp.dataset.winit); if (!w) return; const v = parseSigned(inp.value); if (v !== w.initial) { w.initial = v; saveSettings(); const h = inp.closest(".set-row")?.querySelector(".hint b"); if (h) h.textContent = fmt(walletBalances()[w.id] || 0); } }, 600);
  }
  if (e.target.matches && e.target.matches("[data-wname]")) { const inp = e.target; clearTimeout(inp._t); inp._t = setTimeout(() => { const w = walletById(inp.dataset.wname), v = inp.value.trim(); if (w && v && v !== w.name) { w.name = v; saveSettings(); } }, 600); }
  if (e.target.matches && e.target.matches("[data-bud]")) formatAmountInput(e.target);
  if (e.target.id === "cat-q") { const q = e.target.value.trim().toLowerCase(); let n = 0; document.querySelectorAll("#cat-grid .cat-chip").forEach(b => { const ok = !q || b.dataset.name.includes(q); b.hidden = !ok; if (ok) n++; }); const no = $("#cat-none"); if (no) no.style.display = n ? "none" : ""; }
  if (e.target.id === "f-q") { S.f.q = e.target.value; $("#tx-list").innerHTML = txListHtml(); }
});
document.addEventListener("change", e => {
  const el = e.target, d = el.dataset;
  if (el.id === "f-cat") { S.f.cat = el.value; render(); }
  else if (el.id === "f-wallet") { S.f.wallet = el.value; render(); }
  else if (el.id === "f-from" || el.id === "f-to") {
    S.f[el.id === "f-from" ? "from" : "to"] = el.value || "";
    if (S.f.from && S.f.to && S.f.from > S.f.to) { const x = S.f.from; S.f.from = S.f.to; S.f.to = x; }
    render();
  }
  else if (d.bud) {
    const v = parseAmount(el.value);
    const c = Object.assign({}, budOf(S.month).cats); if (v) c[d.bud] = v; else delete c[d.bud]; budSet(S.month, { cats: c });
    saveSettings(); render();
  } else if (d.wname) {
    const w = walletById(d.wname); const v = el.value.trim();
    if (w && v && v !== w.name) { w.name = v; saveSettings(); } else if (w && !v) el.value = w.name;
  } else if (d.winit) {
    const w = walletById(d.winit); if (w) { const v = parseSigned(el.value); if (v !== w.initial) { w.initial = v; saveSettings(); } render(); }
  } else if (d.cname) {
    const c = catById(d.cname); const v = el.value.trim();
    if (c && v && v !== c.name) { c.name = v; saveSettings(); } else if (c && !v) el.value = c.name;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches("[data-bud],[data-winit],[data-wname],[data-cname]")) e.target.blur();
  if (e.key === "Enter" && e.target.id === "bud-total") actions["bud-save"]();
});

/* ---------- khởi động ---------- */
try {
  const u = new URL(location.href);
  if (u.searchParams.has("_nf_embed")) { u.searchParams.delete("_nf_embed"); history.replaceState(null, "", u.pathname + (u.search || "") + u.hash); }
} catch (e) {}
const h0 = location.hash.slice(1);
if (VIEWS.some(v => v[0] === h0)) S.view = h0;
render();
initStore();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("message", e => {
    if (e.data !== "update-ready" || document.getElementById("upd")) return;
    const bar = document.createElement("div"); bar.id = "upd"; bar.className = "upd";
    bar.innerHTML = '<span>Đã có bản mới của sổ</span><button type="button" class="btn sm primary">Cập nhật</button>';
    bar.querySelector("button").onclick = () => location.reload();
    document.body.appendChild(bar);
  });
}
})();
</script>
</body>
