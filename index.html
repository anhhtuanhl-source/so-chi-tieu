<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ Chi Tiêu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="theme-color" content="#0f6b5c">
<meta name="description" content="Sổ chi tiêu cá nhân: ghi thu chi, ngân sách, báo cáo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Chi Tiêu">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sổ tài chính cá nhân — thanh điều hướng trái (máy tính) / thanh tab dưới (điện thoại), vùng làm việc dạng lưới thẻ. */
:root {
  color-scheme: light;
  --bg: #f3f5f4;
  --surface: #ffffff;
  --surface-2: #edf1ef;
  --ink: #14201d;
  --ink-2: #4a5a55;
  --muted: #74847f;
  --line: #dce3e0;
  --accent: #0f6b5c;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe9;
  --pos: #0b7a4b;
  --inc: #1baf7a;
  --exp: #eb6834;
  --good: #0ca30c;
  --warn: #fab219;
  --crit: #d03b3b;
  --shadow: 0 1px 2px rgba(20,32,29,.06), 0 4px 16px rgba(20,32,29,.05);
  --hero-a: #0b5a4d; --hero-b: #17927a; --hero-ink: #ffffff;
  --c0: #8f9a96; --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --font-display: "Lexend", "Be Vietnam Pro", system-ui, sans-serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1413; --surface: #161e1c; --surface-2: #1f2a27; --ink: #e7eeeb; --ink-2: #b3c1bc;
    --muted: #84948f; --line: #2a3633; --accent: #44b8a0; --accent-ink: #062019; --accent-soft: #17332d;
    --pos: #5fcf9a; --inc: #199e70; --exp: #d95926;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    --hero-a: #0f4d43; --hero-b: #1a7a67; --hero-ink: #ffffff;
    --c0: #6f7b77; --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #0ca30c; --c7: #9085e9; --c8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1413; --surface: #161e1c; --surface-2: #1f2a27; --ink: #e7eeeb; --ink-2: #b3c1bc;
  --muted: #84948f; --line: #2a3633; --accent: #44b8a0; --accent-ink: #062019; --accent-soft: #17332d;
  --pos: #5fcf9a; --inc: #199e70; --exp: #d95926;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  --hero-a: #0f4d43; --hero-b: #1a7a67; --hero-ink: #ffffff;
  --c0: #6f7b77; --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
  --c5: #d55181; --c6: #0ca30c; --c7: #9085e9; --c8: #e66767;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 22px; }
h2 { font-size: 16px; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 224px 1fr; min-height: 100%; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 15px var(--font-display); }
.brand-name { font: 600 17px var(--font-display); }
.nav-btn { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; border: 0; background: none; cursor: pointer; text-align: left; color: var(--ink-2); font-weight: 500; }
.nav-btn svg { width: 18px; height: 18px; flex: none; }
.nav-btn:hover { background: var(--surface-2); color: var(--ink); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side .add-main { margin-top: 14px; }
.side-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 0 10px; }

.main { padding: 22px 28px 120px; max-width: 1120px; width: 100%; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.month-pick { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.month-pick button { width: 32px; height: 32px; border: 0; background: none; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-size: 18px; line-height: 1; }
.month-pick button:hover { background: var(--surface-2); }
.month-pick .lbl { min-width: 118px; text-align: center; font-weight: 600; font-size: 14px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); background: var(--accent); }
.btn.danger { color: var(--crit); }
.btn.sm { height: 32px; padding: 0 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: none; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); font-size: 13px; margin-bottom: 16px; }
.banner b { color: var(--ink); }

.grid { display: grid; gap: 16px; }
.tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.two { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h .link { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 13px; cursor: pointer; padding: 4px; }
.stack { display: flex; flex-direction: column; gap: 16px; }

.tile .k { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.tile .k i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.tile .v { font: 600 22px/1.25 var(--font-display); margin-top: 6px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .s { font-size: 12px; color: var(--muted); margin-top: 4px; }
.tile.hero { background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); color: var(--hero-ink); border-color: transparent; position: relative; overflow: hidden; }
.tile.hero::after { content: ""; position: absolute; right: -30px; top: -30px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.08); }
.tile.hero .k, .tile.hero .s { color: inherit; opacity: .85; }
.tile .k .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--cc) 15%, transparent); color: var(--cc); }
.tile.hero .k .ic { background: rgba(255,255,255,.16); color: #fff; }
.tile .k .ic svg { width: 16px; height: 16px; }
.tile.inc { border-top: 3px solid var(--inc); }
.tile.exp { border-top: 3px solid var(--exp); }
.tile.net { border-top: 3px solid var(--c1); }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; background: var(--cc); }
.donut-box { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 18px; align-items: center; }
.donut-box svg { width: 170px; height: 170px; display: block; }
.donut-box .seg-arc { cursor: default; transition: opacity .15s; }
.donut-box svg:hover .seg-arc { opacity: .55; }
.donut-box svg .seg-arc:hover { opacity: 1; }
.leg-list { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.leg-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13.5px; padding: 4px 0; }
.leg-row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.leg-row .vv { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.leg-row .vv b { color: var(--ink); font-weight: 600; margin-right: 6px; }
@media (max-width: 460px) { .donut-box { grid-template-columns: 1fr; justify-items: center; } .leg-list { width: 100%; } }
.swatch { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); background: var(--cc); cursor: pointer; padding: 0; }
.legend.wrap { flex-wrap: wrap; gap: 6px 14px; }

.wallets { display: flex; flex-direction: column; }
.wallet-row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.wallet-row:first-child { border-top: 0; }
.wallet-row .n { color: var(--ink-2); }
.wallet-row .b { font-weight: 600; font-variant-numeric: tabular-nums; }
.neg-bal { color: var(--crit); }

/* danh sách giao dịch */
.tx { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 9px 6px; border: 0; background: none; border-radius: 9px; cursor: pointer; text-align: left; }
.tx:hover { background: var(--surface-2); }
.badge { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); font: 600 14px var(--font-display); }
.badge.inc { background: var(--accent-soft); color: var(--accent); }
.badge.cc { background: color-mix(in srgb, var(--cc) 16%, transparent); color: var(--cc); }
.badge.trf { background: transparent; border: 1px dashed var(--line); }
.tx .t1 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .t2 { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .amt { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.amt.pos { color: var(--pos); }
.amt.trf { color: var(--muted); }
.day { margin-top: 10px; }
.day-h { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); padding: 6px 6px 4px; border-bottom: 1px solid var(--line); margin-bottom: 2px; }
.day-h b { color: var(--ink-2); font-weight: 600; }

.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.empty p { margin: 0 0 12px; }

/* thanh tiến độ */
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 8px 0; }
.bar-row .nm { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row .val { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }
.track { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.fill { height: 100%; border-radius: 4px; background: var(--exp); min-width: 2px; }
.fill.good { background: var(--good); } .fill.warn { background: var(--warn); } .fill.crit { background: var(--crit); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); }
.pill.crit { background: color-mix(in srgb, var(--crit) 16%, transparent); color: var(--crit); }
.pill.warn { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--ink); }
.pill.good { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--pos); }

/* bộ lọc */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.filters input, .filters select { height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 0 10px; }
.filters input { flex: 1 1 180px; min-width: 0; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 13.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
.sum-line { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); padding: 4px 6px; }
.sum-line b { font-variant-numeric: tabular-nums; color: var(--ink); }

/* biểu đồ */
.chart-wrap { position: relative; }
.chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart-wrap .ax { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart-wrap .gl { stroke: var(--line); stroke-width: 1; }
.chart-wrap .base { stroke: var(--ink-2); stroke-width: 1; opacity: .5; }
.hit { fill: transparent; cursor: default; }
.hit:hover { fill: var(--ink); fill-opacity: .04; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 9px; padding: 8px 10px; font-size: 12.5px; min-width: 170px; z-index: 5; display: none; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
.tip .r i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }
.tip .h { font-weight: 600; margin-bottom: 4px; }

table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.data th, table.data td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
.tbl-wrap { overflow-x: auto; }

/* cài đặt */
.set-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 0; }
.set-row.cat { grid-template-columns: auto minmax(0, 1fr) auto; }
.field { height: 38px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 0 10px; width: 100%; min-width: 0; }
.field.r { text-align: right; font-variant-numeric: tabular-nums; }
.set-head { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 8px; font-size: 12px; color: var(--muted); }
.hint { font-size: 12.5px; color: var(--muted); }
.budget-row { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 6px 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.budget-row:first-child { border-top: 0; }
.budget-row .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--ink-2); grid-column: 1 / -1; flex-wrap: wrap; }
.budget-row .track { grid-column: 1 / -1; }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(8,14,12,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.scrim.open { display: flex; }
.modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 460px; max-height: calc(100% - 16px); overflow: auto; padding: 18px 20px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal h2 { font-size: 18px; margin-bottom: 14px; }
.modal label { display: block; font-size: 12.5px; color: var(--ink-2); font-weight: 500; margin: 12px 0 5px; }
.amount-in { width: 100%; height: 56px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); padding: 0 14px; font: 600 26px var(--font-display); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-size: 13.5px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-actions { display: flex; gap: 8px; margin-top: 20px; }
.modal-actions .sp { flex: 1; }
.err { color: var(--crit); font-size: 13px; margin-top: 8px; min-height: 1em; }

.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 13.5px; z-index: 60; display: none; max-width: calc(100% - 32px); }
.toast.show { display: block; }

.tabbar, .fab { display: none; }
.mp-wrap { position: relative; }
.tiles3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 720px) { .tiles3 { grid-template-columns: 1fr 1fr; } .tiles3 > .hero { grid-column: 1 / -1; } .mp-pop { z-index: 50; } }
.month-pick .lbl { width: auto; min-width: 140px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 14px; color: var(--ink); }
.mp-pop { position: absolute; top: calc(100% + 6px); right: 0; z-index: 30; width: 296px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 40px rgba(0,0,0,.18); padding: 12px; }
.mp-head { display: flex; align-items: center; justify-content: space-between; font-weight: 600; margin-bottom: 10px; }
.mp-head button { width: 34px; height: 34px; border: 0; background: none; border-radius: 8px; cursor: pointer; font-size: 18px; color: var(--ink-2); }
.mp-head button:hover { background: var(--surface-2); }
.mp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.mp-grid button { height: 40px; border: 1.5px solid transparent; background: var(--surface-2); border-radius: 9px; cursor: pointer; font-size: 13.5px; font-weight: 500; }
.mp-grid button:hover { border-color: var(--line); }
.mp-grid button.cur { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.mp-grid button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.mp-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }
.date-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; margin: 4px 0 8px; background: var(--surface-2); border-radius: 10px; }
.df-label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.df-field { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.df-field input { height: 34px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0 8px; }
.date-filter .chip { padding: 4px 10px; font-size: 13px; }
.fund-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.fund { border-top: 4px solid var(--cc); display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
.fund:hover { box-shadow: 0 6px 20px rgba(20,32,29,.10); }
.fund .fh { display: flex; align-items: center; gap: 10px; }
.fund .fb { font: 600 22px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.fund .acts { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }
.fund-new { border: 2px dashed var(--line); background: transparent; box-shadow: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 180px; cursor: pointer; color: var(--accent); }
.fund-new:hover { background: var(--accent-soft); }
.loan-row { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 6px; border-top: 1px solid var(--line); cursor: pointer; border-radius: 8px; }
.loan-row:hover { background: var(--surface-2); }
.hist { display: flex; flex-direction: column; max-height: 260px; overflow: auto; }

<body>
<div class="app">
  <nav class="side" aria-label="Điều hướng">
    <div class="brand"><div class="brand-mark">₫</div><div class="brand-name">Sổ Chi Tiêu</div></div>
    <div id="nav-side"></div>
    <button class="btn primary add-main" data-act="add-tx" type="button">+ Thêm giao dịch</button>

</div>
<nav class="tabbar" id="nav-bottom" aria-label="Điều hướng"></nav>

<div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<div class="tip" id="tip"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
(function () {
"use strict";

/* ---------- tiện ích ---------- */
const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nf = new Intl.NumberFormat("vi-VN");
const fmt = n => nf.format(Math.round(n)) + " ₫";
const fmtNum = n => nf.format(Math.round(n));
function fmtShort(n) {
  const a = Math.abs(n), s = n < 0 ? "−" : "";
  const t = (v) => (Math.round(v * 10) / 10).toString().replace(".", ",");
  if (a >= 1e9) return s + t(a / 1e9) + " tỷ";
  if (a >= 1e6) return s + t(a / 1e6) + " tr";
  if (a >= 1e3) return s + Math.round(a / 1e3) + "k";
  return s + Math.round(a);
}
function parseAmount(raw) {
  let s = String(raw || "").trim().toLowerCase().replace(/\s|₫|đ|vnd/g, "");
  if (!s) return 0;
  let mult = 1;
  if (/(triệu|tr|m)$/.test(s)) { mult = 1e6; s = s.replace(/(triệu|tr|m)$/, ""); }
  else if (/(nghìn|ngàn|k)$/.test(s)) { mult = 1e3; s = s.replace(/(nghìn|ngàn|k)$/, ""); }
  else if (/(tỷ|ty|b)$/.test(s)) { mult = 1e9; s = s.replace(/(tỷ|ty|b)$/, ""); }
  let v;
  if (mult > 1) v = parseFloat(s.replace(",", ".")) * mult;
  else v = parseInt(s.replace(/[.,]/g, ""), 10);
  return Number.isFinite(v) && v > 0 ? Math.round(v) : 0;
}
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const shiftMonth = (key, delta) => { let [y, m] = key.split("-").map(Number); m += delta; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${pad(m)}`; };
const monthLabel = key => { const [y, m] = key.split("-"); return `Tháng ${+m}/${y}`; };
const monthShort = key => { const [y, m] = key.split("-"); return `T${+m}/${y.slice(2)}`; };
const DOW = ["Chủ nhật", "Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7"];
const dayLabel = ds => { const [y, m, d] = ds.split("-").map(Number); const dt = new Date(y, m - 1, d); const t = todayStr(); return (ds === t ? "Hôm nay" : DOW[dt.getDay()]) + `, ${pad(d)}/${pad(m)}`; };

function defaults() {
  const c = (name, type, i) => ({ id: newId() + name.length, name, type, color: /khác/i.test(name) ? 0 : i + 1 });
  return {
    wallets: [
      { id: "w-cash", name: "Tiền mặt", initial: 0 },
      { id: "w-bank", name: "Tài khoản ngân hàng", initial: 0 },
      { id: "w-ewallet", name: "Ví điện tử", initial: 0 },
      { id: "w-credit", name: "Thẻ tín dụng", initial: 0 }
    ],
    categories: [
      ...["Ăn uống", "Đi lại", "Nhà cửa", "Hóa đơn", "Mua sắm", "Giải trí", "Sức khỏe", "Giáo dục", "Khác"].map((n, i) => c(n, "expense", i)),
      ...["Lương", "Thưởng", "Kinh doanh", "Quà tặng", "Thu khác"].map((n, i) => c(n, "income", i))
    ],
    budgets: {}
  };
}

/* ---------- trạng thái ---------- */
const S = {
  settings: null,
  months: {},          // "YYYY-MM" -> [tx]
  mode: "loading",     // loading | cloud | local
  month: todayStr().slice(0, 7),
  view: "tong-quan",
  f: { type: "all", cat: "", wallet: "", q: "", from: "", to: "" },
  mp: null,
  loanTab: "borrow",
  range: 6,
  slow: false,
  auth: "unknown",
  sync: "ok",
  authTab: "login",
  skipLogin: (() => { try { return localStorage.getItem("so-chi-tieu-skip-login") === "1"; } catch (e) { return false; } })()
};

/* ---------- lưu trữ ---------- */
// Điền 2 giá trị của dự án Supabase để bật đăng nhập và đồng bộ. Để trống thì sổ chỉ lưu trên thiết bị.
const SUPABASE_URL = "https://mzkevskppdetztypdzdt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_axkJ2_McUZ_uFFHtGkLvLg_V3oBvuTy";

const LS_KEY = "so-chi-tieu-v1";
const SKIP_KEY = "so-chi-tieu-skip-login";
let sb = null, uid = null, channel = null;
let synced = {};                          // id -> chuỗi JSON đã có trên máy chủ
let pend = { up: {}, del: {}, settings: false };
let flushing = false, flushTimer = null, retryTimer = null, lastLoad = 0, renderTimer = null;

const cacheKey = () => "so-chi-tieu-sync:" + uid;
const stable = o => JSON.stringify(o, Object.keys(o).sort());
const pendCount = () => Object.keys(pend.up).length + Object.keys(pend.del).length + (pend.settings ? 1 : 0);

function lsLoad() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { const d = JSON.parse(raw); S.settings = d.settings; S.months = d.months || {}; S.lastBackup = d.lastBackup || null; } } catch (e) {}
  if (!S.settings) S.settings = defaults();
}
function lsSave() {
  if (S.mode === "sync") { saveCache(); return; }
  try { localStorage.setItem(LS_KEY, JSON.stringify({ settings: S.settings, months: S.months, lastBackup: S.lastBackup || null })); }
  catch (e) { toast("Không lưu được: bộ nhớ trình duyệt đã đầy hoặc bị chặn."); }
}
function saveCache() {
  if (!uid) return;
  try { localStorage.setItem(cacheKey(), JSON.stringify({ settings: S.settings, months: S.months, synced, pend, lastBackup: S.lastBackup || null })); } catch (e) {}
}
function loadCache() {
  try { const raw = localStorage.getItem(cacheKey()); if (!raw) return false; const d = JSON.parse(raw); S.settings = normalize(d.settings); S.months = d.months || {}; synced = d.synced || {}; pend = Object.assign({ up: {}, del: {}, settings: false }, d.pend || {}); S.lastBackup = d.lastBackup || null; return true; } catch (e) { return false; }
}

function saveSettings() {
  if (S.mode === "sync") { pend.settings = true; saveCache(); flushSoon(); }
  else lsSave();
}
function saveMonth() {
  if (S.mode === "sync") { diffTx(); saveCache(); flushSoon(); }
  else lsSave();
}
/* So sánh dữ liệu trên máy với bản đã đồng bộ để biết dòng nào cần gửi, dòng nào cần xóa */
function diffTx() {
  const cur = {};
  allTx().forEach(t => cur[t.id] = t);
  Object.keys(cur).forEach(id => {
    const j = stable(cur[id]);
    if (synced[id] !== j) { pend.up[id] = cur[id]; delete pend.del[id]; }
    else { delete pend.up[id]; delete pend.del[id]; }
  });
  Object.keys(pend.up).forEach(id => { if (!cur[id]) delete pend.up[id]; });
  Object.keys(synced).forEach(id => { if (!cur[id]) pend.del[id] = true; });
}

function setSync(state) { S.sync = state; renderSyncState(); }
function renderSyncState() {
  const n = pendCount();
  let txt = "", cls = "";
  if (S.mode !== "sync") txt = "";
  else if (S.sync === "offline") { txt = n ? `Chưa đồng bộ (${n})` : "Ngoại tuyến"; cls = "off"; }
  else if (S.sync === "syncing" || n) { txt = "Đang đồng bộ…"; cls = "busy"; }
  else { txt = "Đã đồng bộ"; cls = "ok"; }
  document.querySelectorAll(".sync-pill").forEach(el => { el.textContent = txt; el.className = "sync-pill " + cls; el.hidden = !txt; });
}
function flushSoon() { renderSyncState(); clearTimeout(flushTimer); flushTimer = setTimeout(flush, 400); }
async function flush() {
  if (flushing || !sb || !uid || S.mode !== "sync") return;
  if (!pendCount()) { if (S.sync !== "offline") setSync("ok"); return; }
  flushing = true; setSync("syncing");
  try {
    if (pend.settings) {
      const snap = stable(S.settings);
      const { error } = await sb.from("settings").upsert({ user_id: uid, data: S.settings, updated_at: new Date().toISOString() });
      if (error) throw error;
      if (stable(S.settings) === snap) pend.settings = false;
    }
    const ups = Object.values(pend.up);
    for (let i = 0; i < ups.length; i += 500) {
      const chunk = ups.slice(i, i + 500);
      const { error } = await sb.from("transactions").upsert(chunk.map(t => ({ id: t.id, user_id: uid, data: t, updated_at: new Date().toISOString() })));
      if (error) throw error;
      chunk.forEach(t => { synced[t.id] = stable(t); if (pend.up[t.id] === t) delete pend.up[t.id]; });
    }
    const dels = Object.keys(pend.del);
    for (let i = 0; i < dels.length; i += 200) {
      const chunk = dels.slice(i, i + 200);
      const { error } = await sb.from("transactions").delete().in("id", chunk);
      if (error) throw error;
      chunk.forEach(id => { delete synced[id]; delete pend.del[id]; });
    }
    saveCache();
    flushing = false;
    if (pendCount()) return flush();
    setSync("ok");
  } catch (e) {
    flushing = false; saveCache(); setSync("offline");
    clearTimeout(retryTimer); retryTimer = setTimeout(flush, 15000);
  }
}

/* Tải toàn bộ dữ liệu của tài khoản từ máy chủ */
async function loadAll() {
  if (!sb || !uid) return;
  const st = await sb.from("settings").select("data").eq("user_id", uid).maybeSingle();
  if (st.error) throw st.error;
  let rows = [];
  for (let from = 0; ; from += 1000) {
    const r = await sb.from("transactions").select("id,data").order("id").range(from, from + 999);
    if (r.error) throw r.error;
    rows = rows.concat(r.data || []);
    if (!r.data || r.data.length < 1000) break;
  }
  lastLoad = Date.now();
  synced = {};
  const byId = {};
  rows.forEach(r => { const t = Object.assign({}, r.data, { id: r.id }); synced[r.id] = stable(t); byId[r.id] = t; });
  Object.values(pend.up).forEach(t => byId[t.id] = t);
  Object.keys(pend.del).forEach(id => delete byId[id]);
  const firstTime = S.mode === "loading";
  const serverEmpty = !st.data && !rows.length;
  if (firstTime && serverEmpty) {
    const local = readLocalData();
    S.mode = "sync";
    if (local) {
      S.settings = normalize(local.settings); S.months = {};
      render();
      confirmBox("Đưa dữ liệu lên tài khoản?", `Thiết bị này đang có ${local.n} giao dịch chưa thuộc tài khoản nào. Bạn có muốn đưa toàn bộ lên tài khoản để đồng bộ sang các thiết bị khác không?`, "Đưa lên", () => {
        S.months = JSON.parse(JSON.stringify(local.months)); pend.settings = true; diffTx(); saveCache(); render(); flush(); toast(`Đang tải ${local.n} giao dịch lên tài khoản`);
      }, () => { S.settings = defaults(); S.months = {}; pend.settings = true; saveCache(); render(); flush(); }, "Bắt đầu sổ mới");
      return;
    }
    S.settings = defaults(); pend.settings = true;
  } else if (st.data && !pend.settings) {
    S.settings = normalize(JSON.parse(JSON.stringify(st.data.data)));
    if (needsMigrate) { needsMigrate = false; pend.settings = true; }
  } else if (!st.data) pend.settings = true;
  const months = {};
  Object.values(byId).forEach(t => (months[t.date.slice(0, 7)] = months[t.date.slice(0, 7)] || []).push(t));
  S.months = months;
  S.mode = "sync";
  saveCache(); render(); flush();
}
function readLocalData() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (!d || !d.settings) return null;
    const n = Object.values(d.months || {}).reduce((a, m) => a + (Array.isArray(m) ? m.length : 0), 0);
    return n ? { settings: d.settings, months: d.months, n } : null;
  } catch (e) { return null; }
}

function applyRemoteTx(p) {
  if (p.eventType === "DELETE") {
    const id = p.old && p.old.id; if (!id || pend.up[id]) return;
    delete synced[id]; delete pend.del[id];
    Object.keys(S.months).forEach(k => { S.months[k] = S.months[k].filter(t => t.id !== id); if (!S.months[k].length) delete S.months[k]; });
  } else {
    const r = p.new; if (!r || !r.data || pend.up[r.id] || pend.del[r.id]) return;
    const t = Object.assign({}, r.data, { id: r.id });
    if (synced[r.id] === stable(t)) return;
    synced[r.id] = stable(t);
    Object.keys(S.months).forEach(k => { S.months[k] = S.months[k].filter(x => x.id !== r.id); if (!S.months[k].length) delete S.months[k]; });
    const m = t.date.slice(0, 7); (S.months[m] = S.months[m] || []).push(t);
  }
  saveCache(); renderSoon();
}
function applyRemoteSettings(p) {
  if (pend.settings || !p.new || !p.new.data) return;
  S.settings = normalize(JSON.parse(JSON.stringify(p.new.data)));
  saveCache(); renderSoon();
}
function renderSoon() { clearTimeout(renderTimer); renderTimer = setTimeout(() => { if (!$("#scrim").classList.contains("open") || !M) render(); else renderTimer = setTimeout(renderSoon, 1500); }, 250); }

function subscribe() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("so-chi-tieu-" + uid)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "transactions", filter: "user_id=eq." + uid }, applyRemoteTx)
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "transactions", filter: "user_id=eq." + uid }, applyRemoteTx)
    .on("postgres_changes", { event: "DELETE", schema: "public", table: "transactions" }, applyRemoteTx)
    .on("postgres_changes", { event: "*", schema: "public", table: "settings", filter: "user_id=eq." + uid }, applyRemoteSettings)
    .subscribe(status => { if (status === "SUBSCRIBED" && S.mode === "sync" && Date.now() - lastLoad > 5000) refresh(); });
}
async function refresh() {
  try { await flush(); await loadAll(); if (!pendCount()) setSync("ok"); }
  catch (e) { setSync("offline"); }
}

async function startSync(user) {
  if (uid === user.id && S.auth === "signedin") return;
  uid = user.id; S.email = user.email; S.auth = "signedin"; S.loadError = null;
  clearTimeout(S.slowTimer);
  S.slowTimer = setTimeout(() => { if (S.mode === "loading" && !S.loadError) { S.loadError = "Máy chủ phản hồi chậm hơn bình thường."; render(); } }, 15000);
  synced = {}; pend = { up: {}, del: {}, settings: false };
  if (loadCache()) { S.mode = "sync"; render(); }
  else { S.mode = "loading"; render(); }
  subscribe();
  try { await loadAll(); clearTimeout(S.slowTimer); }
  catch (e) {
    clearTimeout(S.slowTimer);
    if (S.mode === "loading") { S.loadError = describeErr(e); render(); }
    else setSync("offline");
    clearTimeout(retryTimer); retryTimer = setTimeout(() => startSyncRetry(), 15000);
  }
}
async function startSyncRetry() { if (!uid) return; clearTimeout(retryTimer); try { await loadAll(); S.loadError = null; } catch (e) { if (S.mode === "loading") { S.loadError = describeErr(e); render(); } retryTimer = setTimeout(startSyncRetry, 15000); } }
function describeErr(e) {
  const m = String((e && (e.message || e.details || e.hint)) || e || "");
  if (/relation .* does not exist|Could not find the table|schema cache/i.test(m)) return "Chưa có bảng dữ liệu trên Supabase. Hãy chạy lại đoạn SQL tạo bảng trong SQL Editor.";
  if (/JWT|apikey|Invalid API key|No API key/i.test(m)) return "Khóa kết nối Supabase không hợp lệ.";
  if (/fetch|network|Failed/i.test(m)) return "Không kết nối được máy chủ. Kiểm tra mạng.";
  return "Lỗi từ máy chủ: " + m;
}

async function initStore() {
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  window.addEventListener("storage", e => { if (S.mode === "local" && e.key === LS_KEY) { lsLoad(); S.settings = normalize(S.settings); render(); } });
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !window.supabase) { S.auth = "none"; goLocal(); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === "PASSWORD_RECOVERY") setTimeout(openNewPassword, 300);
    if (ev === "SIGNED_IN" && session && session.user) { const u = session.user; setTimeout(() => startSync(u), 0); }
  });
  let session = null;
  try { session = (await sb.auth.getSession()).data.session; } catch (e) {}
  if (session) startSync(session.user);
  else { S.auth = "signedout"; goLocal(); }
  window.addEventListener("online", () => { if (S.mode === "sync") refresh(); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.mode === "sync" && Date.now() - lastLoad > 30000) refresh(); });
}
async function signOut() {
  if (pendCount()) { toast("Còn thay đổi chưa đồng bộ. Hãy kết nối mạng rồi thử lại."); flush(); return; }
  try { if (channel) await sb.removeChannel(channel); await sb.auth.signOut(); } catch (e) {}
  try { localStorage.removeItem(cacheKey()); } catch (e) {}
  uid = null; channel = null; synced = {}; pend = { up: {}, del: {}, settings: false };

  if (/already registered|already been registered/i.test(m)) return "Email này đã có tài khoản. Hãy chọn Đăng nhập.";
  if (/password.*(6|characters)|weak/i.test(m)) return "Mật khẩu cần ít nhất 6 ký tự.";
  if (/rate|too many/i.test(m)) return "Bạn thử quá nhiều lần. Đợi vài phút rồi thử lại.";
  if (/fetch|network|failed/i.test(m)) return "Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.";
  if (/signups not allowed|signup.*disabled/i.test(m)) return "Đã tắt đăng ký tài khoản mới.";

function totals(key) {

function walletBalances() {
  const bal = {};
  S.settings.wallets.forEach(w => bal[w.id] = Number(w.initial) || 0);
  allTx().forEach(t => {
    if (t.type === "income") bal[t.walletId] = (bal[t.walletId] || 0) + t.amount;
    else if (t.type === "expense") bal[t.walletId] = (bal[t.walletId] || 0) - t.amount;
    else if (t.type === "transfer") { bal[t.walletId] = (bal[t.walletId] || 0) - t.amount; bal[t.toWalletId] = (bal[t.toWalletId] || 0) + t.amount; }
  });
  funds().forEach(f => (f.entries || []).forEach(e => { if (e.walletId) bal[e.walletId] = (bal[e.walletId] || 0) - e.amount; }));
  loans().forEach(l => {
    const sg = l.kind === "borrow" ? 1 : -1;
    if (l.walletId) bal[l.walletId] = (bal[l.walletId] || 0) + sg * l.amount;
    (l.payments || []).forEach(p => { if (p.walletId) bal[p.walletId] = (bal[p.walletId] || 0) - sg * ((p.principal || 0) + (p.interest || 0)); });
  });

}
function spendByCat(keys) {

const funds = () => S.settings.funds || (S.settings.funds = []);

const fundById = id => funds().find(f => f.id === id);
const loanById = id => loans().find(l => l.id === id);
const fundBal = f => (f.entries || []).reduce((a, e) => a + e.amount, 0);
const loanPaid = l => (l.payments || []).reduce((a, p) => a + (p.principal || 0), 0);
const loanIntPaid = l => (l.payments || []).reduce((a, p) => a + (p.interest || 0), 0);
const loanLeft = l => Math.max(0, (l.amount || 0) - loanPaid(l));
const fmtDate = ds => { if (!ds) return ""; const [y, m, d] = ds.split("-"); return `${d}/${m}/${y}`; };
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5);
const monthsUntil = ds => { const t = todayStr(); const [y1, m1] = t.split("-").map(Number), [y2, m2] = ds.split("-").map(Number); return (y2 - y1) * 12 + (m2 - m1) + 1; };

function loanDue(l) {
  if (!l.due || loanLeft(l) <= 0) return null;
  const d = daysBetween(todayStr(), l.due);
  if (d < 0) return ["crit", `Quá hạn ${-d} ngày`];
  if (d === 0) return ["crit", "Đến hạn hôm nay"];
  if (d <= 7) return ["warn", `Còn ${d} ngày đến hạn`];
  return ["", "Hạn " + fmtDate(l.due)];
}
function loanInterestEst(l) {
  if (!l.rate || loanLeft(l) <= 0) return 0;
  const last = (l.payments || []).map(p => p.date).concat([l.date]).sort().pop();
  const days = Math.max(0, daysBetween(last, todayStr()));
  return Math.round(loanLeft(l) * l.rate / 100 * days / 365);
}
function loanInterestIn(key) {
  let inc = 0, exp = 0;
  loans().forEach(l => (l.payments || []).forEach(p => { if (p.interest > 0 && p.date.slice(0, 7) === key) { if (l.kind === "borrow") exp += p.interest; else inc += p.interest; } }));
  return { inc, exp };
}
function fundDepositedIn(f, key) { return (f.entries || []).reduce((a, e) => a + (e.amount > 0 && e.date.slice(0, 7) === key ? e.amount : 0), 0); }

  const planned = list.reduce((a, f) => a + (f.plan || 0), 0);

  const tiles = `<div class="grid tiles tiles3" style="margin-bottom:16px">
    <div class="card tile hero">${tileK("wallet", "#fff", "Tổng tiền trong các quỹ")}<div class="v">${fmt(total)}</div><div class="s">${list.length} quỹ</div></div>
    <div class="card tile inc">${tileK("inc", "var(--inc)", "Đã nạp tháng này")}<div class="v">${fmt(dep)}</div><div class="s">${planned ? "Kế hoạch " + fmt(planned) + "/tháng" : "Chưa đặt kế hoạch nạp định kỳ"}</div></div>
    <div class="card tile net">${tileK("net", "var(--c1)", "Quỹ đã đạt mục tiêu")}<div class="v">${reached}/${list.filter(f => f.target).length || 0}</div><div class="s">quỹ có đặt mục tiêu</div></div></div>`;
  const cards = list.map(fundCard).join("") + `<button type="button" class="card fund-new" data-act="fund-new"><span style="font-size:28px;line-height:1">+</span><b>Tạo quỹ mới</b><span class="hint">Đặt mục tiêu, hạn và kế hoạch nạp</span></button>`;
  return topbar("Tiết kiệm", false) + tiles + (list.length ? "" : `<div class="banner"><span><b>Tạo quỹ cho từng mục tiêu.</b> Ví dụ quỹ khẩn cấp, du lịch, mua xe. Mỗi lần nạp, tiền được chuyển từ ví sang quỹ, nên số dư ví phản ánh đúng số tiền còn được tiêu.</span></div>`) + `<div class="fund-grid">${cards}</div>`;
}

function nextFundColor() { const used = new Set(funds().map(f => f.color)); for (let i = 1; i <= 8; i++) if (!used.has(i)) return i; return 1; }

function openFundMoney(id, withdraw) {
  const f = fundById(id); if (!f) return;
  const bal = fundBal(f), wb = walletBalances();
  openModal(`<h2>${withdraw ? "Rút từ quỹ" : "Nạp vào quỹ"} ${esc(f.name)}</h2>
    <p class="hint" style="margin:-8px 0 0">Số dư quỹ: <b class="num">${fmt(bal)}</b>${f.target && !withdraw ? ` · còn thiếu ${fmt(Math.max(0, f.target - bal))} để đạt mục tiêu` : ""}</p>
    <label for="fm-amt">Số tiền</label><input class="amount-in" id="fm-amt" inputmode="decimal" autocomplete="off" placeholder="0">
    <div class="hint" id="fm-hint" style="margin-top:4px">Gõ nhanh: 500k, 2tr</div>
    ${!withdraw && f.plan ? `<div class="chips" style="margin-top:8px"><button type="button" class="chip" data-fill="${f.plan}">Theo kế hoạch ${fmtShort(f.plan)}</button>${f.target && f.target > bal ? `<button type="button" class="chip" data-fill="${f.target - bal}">Nạp đủ mục tiêu</button>` : ""}</div>` : withdraw ? `<div class="chips" style="margin-top:8px"><button type="button" class="chip" data-fill="${bal}">Rút toàn bộ</button></div>` : ""}
    <div class="row2"><div><label for="fm-w">${withdraw ? "Rút về ví" : "Lấy tiền từ ví"}</label><select class="field" id="fm-w">${walletOpts(f.walletId || S.settings.wallets[0]?.id)}</select></div>
    <div><label for="fm-date">Ngày</label><input class="field" type="date" id="fm-date" value="${todayStr()}"></div></div>
    <div class="hint" id="fm-wb"></div>
    <label for="fm-note">Ghi chú</label><input class="field" id="fm-note" maxlength="140" placeholder="Không bắt buộc">
    <div class="err" id="fm-err"></div>
    <div class="modal-actions"><span class="sp"></span><button class="btn" type="button" id="fm-cancel">Hủy</button><button class="btn primary" type="button" id="fm-save">${withdraw ? "Rút tiền" : "Nạp tiền"}</button></div>`);
  const showWb = () => { const w = $("#fm-w").value; $("#fm-wb").textContent = "Số dư ví này: " + fmt(wb[w] || 0); };
  showWb(); $("#fm-w").onchange = showWb;
  wireAmount($("#fm-amt"), $("#fm-hint"), "Gõ nhanh: 500k, 2tr");
  $("#modal").querySelectorAll("[data-fill]").forEach(b => b.onclick = () => { $("#fm-amt").value = fmtNum(+b.dataset.fill); $("#fm-amt").dispatchEvent(new Event("input")); });
  $("#fm-cancel").onclick = closeModal;
  const go = () => {
    const amt = parseAmount($("#fm-amt").value);
    if (!amt) { $("#fm-err").textContent = "Nhập số tiền lớn hơn 0."; return; }
    if (withdraw && amt > bal) { $("#fm-err").textContent = "Quỹ chỉ còn " + fmt(bal) + "."; return; }
    const date = $("#fm-date").value || todayStr();
    (f.entries = f.entries || []).push({ id: "e-" + newId(), date, amount: withdraw ? -amt : amt, walletId: $("#fm-w").value, note: $("#fm-note").value.trim(), createdAt: Date.now() });
    saveSettings(); closeModal(); render();
    toast((withdraw ? "Đã rút " : "Đã nạp ") + fmt(amt) + (withdraw ? " từ " : " vào ") + f.name);
  };
  $("#fm-save").onclick = go;
  $("#fm-amt").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  setTimeout(() => $("#fm-amt")?.focus(), 30);
}
function openFundDetail(id) {
  const f = fundById(id); if (!f) return;
  const bal = fundBal(f), cc = `var(--c${f.color || 1})`;
  const hist = (f.entries || []).slice().sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  const rows = hist.length ? hist.map(e => `<div class="hist-row"><div><div style="font-weight:600">${e.amount >= 0 ? "Nạp" : "Rút"} · ${fmtDate(e.date)}</div><div class="hint">${esc(walletName(e.walletId))}${e.note ? " · " + esc(e.note) : ""}</div></div><span class="amt ${e.amount >= 0 ? "pos" : ""}">${e.amount >= 0 ? "+" : "−"}${fmt(Math.abs(e.amount))}</span><button class="btn sm ghost danger" type="button" data-del-entry="${esc(e.id)}" aria-label="Xóa">✕</button></div>`).join("") : `<p class="hint">Chưa có lần nạp nào.</p>`;
  openModal(`<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span class="badge cc" style="--cc:${cc}">${esc(f.name.charAt(0).toUpperCase())}</span><h2 style="margin:0">${esc(f.name)}</h2></div>
    <div class="fb" style="font:600 26px var(--font-display);margin:6px 0">${fmt(bal)}</div>
    ${f.target ? `<div class="bar-row" style="padding:0"><span class="nm hint">Mục tiêu ${fmt(f.target)}${f.deadline ? " · hạn " + fmtDate(f.deadline) : ""}</span><span class="val">${Math.floor(Math.min(100, bal / f.target * 100))}%</span><div class="track"><div class="fill" style="width:${Math.min(100, bal / f.target * 100)}%;background:${cc}"></div></div></div>` : ""}
    ${f.plan ? `<p class="hint" style="margin:6px 0 0">Kế hoạch nạp ${fmt(f.plan)}/tháng · tháng này đã nạp ${fmt(fundDepositedIn(f, todayStr().slice(0, 7)))}</p>` : ""}
    <div style="display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap"><button class="btn primary sm" type="button" id="fdd-dep">+ Nạp</button><button class="btn sm" type="button" id="fdd-wd" ${bal <= 0 ? "disabled" : ""}>Rút</button><button class="btn sm" type="button" id="fdd-edit">Sửa quỹ</button><span class="sp" style="flex:1"></span><button class="btn sm ghost danger" type="button" id="fdd-del">Xóa quỹ</button></div>
    <label>Lịch sử</label><div class="hist">${rows}</div>
    <div class="modal-actions"><span class="sp"></span><button class="btn" type="button" id="fdd-close">Đóng</button></div>`);
  $("#fdd-close").onclick = closeModal;
  $("#fdd-dep").onclick = () => openFundMoney(id, false);
  $("#fdd-wd").onclick = () => openFundMoney(id, true);
  $("#fdd-edit").onclick = () => openFundForm(f);
  $("#fdd-del").onclick = () => {
    if (bal > 0) { toast("Hãy rút hết " + fmt(bal) + " về ví trước khi xóa quỹ."); return; }
    confirmBox("Xóa quỹ “" + esc(f.name) + "”?", "Quỹ và lịch sử nạp rút sẽ bị xóa.", "Xóa quỹ", () => { S.settings.funds = funds().filter(x => x.id !== id); saveSettings(); render(); toast("Đã xóa quỹ"); });
  };
  $("#modal").querySelectorAll("[data-del-entry]").forEach(b => b.onclick = () => {
    const eid = b.dataset.delEntry;
    confirmBox("Xóa lần nạp/rút này?", "Số dư quỹ và ví sẽ được tính lại.", "Xóa", () => { f.entries = f.entries.filter(x => x.id !== eid); saveSettings(); render(); openFundDetail(id); });
  });
}

/* ---------- Vay ---------- */
function loanRow(l) {
  const b = l.kind === "borrow", left = loanLeft(l), pct = l.amount ? Math.min(100, loanPaid(l) / l.amount * 100) : 0;
  const due = loanDue(l);
  const cc = b ? "var(--c8)" : "var(--c1)";
  return `<div class="loan-row" data-act="open-loan" data-id="${esc(l.id)}" role="button" tabindex="0">
    <span class="badge cc" style="--cc:${cc}">${esc(l.person.trim().charAt(0).toUpperCase())}</span>
    <div style="min-width:0"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(l.person)}</b><span class="pill">${b ? "Đi vay" : "Cho vay"}</span>${due ? `<span class="pill ${due[0]}">${due[1]}</span>` : ""}${left <= 0 ? '<span class="pill good">Đã tất toán</span>' : ""}</div>
      <div class="hint">${fmt(l.amount)} · ${fmtDate(l.date)}${l.rate ? " · lãi " + String(l.rate).replace(".", ",") + "%/năm" : ""}${l.note ? " · " + esc(l.note) : ""}</div>
      <div class="track" style="margin-top:6px"><div class="fill" style="width:${pct}%;background:${cc}"></div></div></div>
    <div style="text-align:right"><div class="hint">${left > 0 ? (b ? "Còn phải trả" : "Còn phải thu") : "Đã xong"}</div><div style="font-weight:700" class="num">${fmt(left)}</div>
      ${left > 0 ? `<button class="btn sm" type="button" data-act="loan-pay" data-id="${esc(l.id)}" style="margin-top:6px">${b ? "Trả nợ" : "Thu nợ"}</button>` : ""}</div></div>`;
}
function viewLoans() {
  const all = loans();
  const owe = all.filter(l => l.kind === "borrow").reduce((a, l) => a + loanLeft(l), 0);
  const recv = all.filter(l => l.kind === "lend").reduce((a, l) => a + loanLeft(l), 0);
  const attn = all.filter(l => { const d = loanDue(l); return d && (d[0] === "crit" || d[0] === "warn"); });
  const tab = S.loanTab || "borrow";
  const tabBtn = (v, l, n) => `<button type="button" data-act="loan-tab" data-v="${v}" aria-pressed="${tab === v}">${l} (${n})</button>`;
  const open = k => all.filter(l => l.kind === k && loanLeft(l) > 0);
  const done = all.filter(l => loanLeft(l) <= 0);
  const list = tab === "done" ? done : open(tab);
  list.sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999") || b.date.localeCompare(a.date));
  const tiles = `<div class="grid tiles tiles3" style="margin-bottom:16px">
    <div class="card tile exp">${tileK("exp", "var(--c8)", "Đang nợ (còn phải trả)")}<div class="v">${fmt(owe)}</div><div class="s">${open("borrow").length} khoản đi vay</div></div>
    <div class="card tile net">${tileK("inc", "var(--c1)", "Cho vay (còn phải thu)")}<div class="v">${fmt(recv)}</div><div class="s">${open("lend").length} khoản cho vay</div></div>
    <div class="card tile">${tileK("net", attn.length ? "var(--crit)" : "var(--good)", "Cần chú ý")}<div class="v">${attn.length}</div><div class="s">${attn.length ? "khoản quá hạn hoặc sắp đến hạn" : "Không có khoản nào sắp đến hạn"}</div></div></div>`;
  const empty = { borrow: "Chưa có khoản đi vay nào.", lend: "Chưa có khoản cho vay nào.", done: "Chưa có khoản nào đã tất toán." }[tab];
  return topbar("Vay", false) + tiles + `<div class="card"><div class="card-h"><div class="seg">${tabBtn("borrow", "Đi vay", open("borrow").length)}${tabBtn("lend", "Cho vay", open("lend").length)}${tabBtn("done", "Đã xong", done.length)}</div>
    <button class="btn sm primary" type="button" data-act="loan-new">+ Thêm khoản vay</button></div>
    ${list.length ? list.map(loanRow).join("") : `<div class="empty"><p>${empty}</p><button class="btn primary" type="button" data-act="loan-new">+ Thêm khoản vay</button></div>`}</div>`;
}

let LM = null;
function openLoanForm(l) {
  LM = l ? JSON.parse(JSON.stringify(l)) : { kind: S.loanTab === "lend" ? "lend" : "borrow", person: "", amount: 0, date: todayStr(), due: "", rate: 0, walletId: S.settings.wallets[0]?.id || "", note: "", payments: [] };
  LM.isEdit = !!l;
  const draw = () => {
    const b = LM.kind === "borrow";
    openModal(`<h2>${LM.isEdit ? "Sửa khoản vay" : "Thêm khoản vay"}</h2>
      <div class="seg" style="width:100%;display:grid;grid-template-columns:1fr 1fr"><button type="button" data-kind="borrow" aria-pressed="${b}">Tôi đi vay</button><button type="button" data-kind="lend" aria-pressed="${!b}">Tôi cho vay</button></div>
      <label for="ln-person">${b ? "Vay của ai" : "Cho ai vay"}</label><input class="field" id="ln-person" maxlength="40" value="${esc(LM.person)}" placeholder="${b ? "Ví dụ: Anh Nam, Ngân hàng ACB" : "Ví dụ: Chị Lan"}">
      <label for="ln-amt">Số tiền</label><input class="amount-in" id="ln-amt" inputmode="decimal" autocomplete="off" placeholder="0" value="${LM.amount ? fmtNum(LM.amount) : ""}">
      <div class="hint" id="ln-hint" style="margin-top:4px">Gõ nhanh: 500k, 5tr</div>
      <div class="row2"><div><label for="ln-date">Ngày ${b ? "vay" : "cho vay"}</label><input class="field" type="date" id="ln-date" value="${esc(LM.date)}"></div>
      <div><label for="ln-due">Hạn trả (không bắt buộc)</label><input class="field" type="date" id="ln-due" value="${esc(LM.due || "")}"></div></div>
      <div class="row2"><div><label for="ln-rate">Lãi suất %/năm</label><input class="field r" id="ln-rate" inputmode="decimal" value="${LM.rate ? String(LM.rate).replace(".", ",") : ""}" placeholder="0 nếu không lãi"></div>
      <div><label for="ln-w">${b ? "Tiền nhận vào ví" : "Tiền lấy từ ví"}</label><select class="field" id="ln-w">${walletOpts(LM.walletId, true)}</select></div></div>
      <label for="ln-note">Ghi chú</label><input class="field" id="ln-note" maxlength="140" value="${esc(LM.note || "")}" placeholder="Không bắt buộc">
      <div class="err" id="ln-err"></div>
      <div class="modal-actions"><span class="sp"></span><button class="btn" type="button" id="ln-cancel">Hủy</button><button class="btn primary" type="button" id="ln-save">${LM.isEdit ? "Lưu" : "Thêm"}</button></div>`);
    wireAmount($("#ln-amt"), $("#ln-hint"), "Gõ nhanh: 500k, 5tr");
    $("#modal").querySelectorAll("[data-kind]").forEach(btn => btn.onclick = () => { collectLoan(); LM.kind = btn.dataset.kind; draw(); });
    $("#ln-cancel").onclick = closeModal;
    $("#ln-save").onclick = () => {
      collectLoan();
      if (!LM.person) { $("#ln-err").textContent = "Nhập tên người " + (LM.kind === "borrow" ? "cho bạn vay" : "vay") + "."; return; }
      if (!LM.amount) { $("#ln-err").textContent = "Nhập số tiền lớn hơn 0."; return; }
      if (LM.due && LM.due < LM.date) { $("#ln-err").textContent = "Hạn trả phải sau ngày vay."; return; }
      if (LM.isEdit && LM.amount < loanPaid(LM)) { $("#ln-err").textContent = "Số tiền không được nhỏ hơn số gốc đã trả (" + fmt(loanPaid(LM)) + ")."; return; }
      const rec = { id: LM.id || "l-" + newId(), kind: LM.kind, person: LM.person, amount: LM.amount, date: LM.date, due: LM.due, rate: LM.rate, walletId: LM.walletId, note: LM.note, createdAt: LM.createdAt || Date.now(), payments: LM.payments || [] };
      const wasEdit = LM.isEdit;
      if (wasEdit) { const i = loans().findIndex(x => x.id === rec.id); loans()[i] = rec; } else loans().push(rec);
      S.loanTab = rec.kind;
      saveSettings(); closeModal(); render(); toast(wasEdit ? "Đã lưu khoản vay" : "Đã thêm khoản vay");
    };
    setTimeout(() => $("#ln-person")?.focus(), 30);
  };
  draw();
}
function collectLoan() {
  const g = id => $(id);
  if (g("#ln-person")) LM.person = g("#ln-person").value.trim();
  if (g("#ln-amt")) LM.amount = parseAmount(g("#ln-amt").value);
  if (g("#ln-date")) LM.date = g("#ln-date").value || todayStr();
  if (g("#ln-due")) LM.due = g("#ln-due").value || "";
  if (g("#ln-rate")) { const r = parseFloat(g("#ln-rate").value.replace(",", ".")); LM.rate = Number.isFinite(r) && r > 0 ? r : 0; }
  if (g("#ln-w")) LM.walletId = g("#ln-w").value;
  if (g("#ln-note")) LM.note = g("#ln-note").value.trim();
}

function savingsLoanCard(walletTotal) {
  const fTotal = funds().reduce((a, f) => a + fundBal(f), 0);
  const owe = loans().filter(l => l.kind === "borrow").reduce((a, l) => a + loanLeft(l), 0);
  const recv = loans().filter(l => l.kind === "lend").reduce((a, l) => a + loanLeft(l), 0);
  const overdue = loans().filter(l => { const d = loanDue(l); return d && d[0] === "crit"; }).length;
  if (!funds().length && !loans().length) return `<div class="card"><div class="card-h"><h2>Tiết kiệm và vay</h2></div><p class="hint" style="margin:0 0 10px">Tạo quỹ cho các mục tiêu, ghi lại các khoản vay để không quên hạn trả.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" type="button" data-act="nav" data-v="tiet-kiem">Tạo quỹ</button><button class="btn sm" type="button" data-act="nav" data-v="vay">Ghi khoản vay</button></div></div>`;
  const net = walletTotal + fTotal + recv - owe;
  return `<div class="card"><div class="card-h"><h2>Tiết kiệm và vay</h2></div><div class="wallets">
    <div class="wallet-row"><span class="n"><button class="link-btn" type="button" data-act="nav" data-v="tiet-kiem">Các quỹ tiết kiệm (${funds().length})</button></span><span class="b">${fmt(fTotal)}</span></div>

function catEntries(sp) {
  const rows = Object.entries(sp).filter(r => r[1] > 0).sort((a, b) => b[1] - a[1]);
  let list = rows.map(([id, v]) => ({ id, label: catName(id), val: v, color: catColor(id), gray: (catById(id)?.color ?? 0) === 0 }));
  if (list.length > 8) {
    const top = list.filter(e => !e.gray).slice(0, 7);
    const rest = list.filter(e => !top.includes(e)).reduce((a, e) => a + e.val, 0);
    list = top.concat([{ id: "_rest", label: "Khác & còn lại", val: rest, color: "var(--c0)" }]);
  }
  return list;
}

function donutHtml(entries, total, centerLabel) {
  const R = 62, SW = 24, C = 2 * Math.PI * R, gap = entries.length > 1 ? 2.5 : 0;
  let off = 0;
  let s = `<svg viewBox="0 0 170 170" role="img" aria-label="Cơ cấu chi tiêu theo danh mục"><g transform="rotate(-90 85 85)"><circle cx="85" cy="85" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="${SW}"/>`;
  entries.forEach(e => {
    const len = e.val / total * C, dl = Math.max(0.8, len - gap);
    const k = tipReg(`<div class="h">${esc(e.label)}</div>` + tipRow(e.color, "Đã chi", fmt(e.val)) + tipRow("", "Tỷ trọng", (e.val / total * 100).toFixed(1).replace(".", ",") + "%"));
    s += `<circle class="seg-arc" data-tip="${k}" cx="85" cy="85" r="${R}" fill="none" stroke="${e.color}" stroke-width="${SW}" stroke-dasharray="${dl} ${C}" stroke-dashoffset="${-off}"/>`;
    off += len;
  });
  s += `</g><text x="85" y="79" text-anchor="middle" style="fill:var(--muted);font-size:11px;font-family:var(--font-body)">${centerLabel}</text><text x="85" y="101" text-anchor="middle" style="fill:var(--ink);font-size:19px;font-weight:600;font-family:var(--font-display)">${fmtShort(total)}</text></svg>`;
  return s;
}

function catBreakdown(keys, n) {

}

function dailyChart(key) {
  const [y, m] = key.split("-").map(Number), nd = new Date(y, m, 0).getDate();
  const arr = Array(nd).fill(0), cnt = Array(nd).fill(0);
  monthTx(key).forEach(t => { if (t.type === "expense") { const d = +t.date.slice(8) - 1; arr[d] += t.amount; cnt[d]++; } });
  const max = Math.max(...arr);
  if (!max) return { html: `<p class="hint">Chưa có khoản chi nào trong tháng này.</p>`, avg: 0 };
  const today = todayStr(), cur = today.slice(0, 7);
  const elapsed = key === cur ? +today.slice(8) : key < cur ? nd : 0;
  const avg = elapsed ? arr.slice(0, elapsed).reduce((a, b) => a + b, 0) / elapsed : 0;
  const W = 680, H = 180, pl = 46, pr = 6, pt = 8, pb = 24;
  const step = niceStep(max / 3), top = Math.ceil(max / step) * step;
  const ih = H - pt - pb, yy = v => pt + ih * (1 - v / top), base = yy(0);
  const cw = (W - pl - pr) / nd, bw = Math.max(3, cw - 4);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chi tiêu theo ngày">`;
  for (let v = 0; v <= top + 1e-6; v += step) s += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${yy(v)}" y2="${yy(v)}"/><text class="ax" x="${pl - 8}" y="${yy(v) + 4}" text-anchor="end">${v ? fmtShort(v) : "0"}</text>`;
  arr.forEach((v, i) => {
    const x = pl + cw * i + (cw - bw) / 2;
    const isToday = key === cur && i + 1 === +today.slice(8);
    if (v) s += `<path d="${barPath(x, base, bw, base - yy(v))}" fill="var(--exp)" ${v > avg * 1.8 && avg ? "" : 'fill-opacity="0.78"'}/>`;
    if (i === 0 || (i + 1) % 5 === 0 || i === nd - 1 || isToday) s += `<text class="ax" x="${x + bw / 2}" y="${H - 7}" text-anchor="middle" ${isToday ? 'style="font-weight:700;fill:var(--ink)"' : ""}>${i + 1}</text>`;
  });
  if (avg) s += `<line x1="${pl}" x2="${W - pr}" y1="${yy(avg)}" y2="${yy(avg)}" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  s += `<line class="base" x1="${pl}" x2="${W - pr}" y1="${base}" y2="${base}"/>`;
  arr.forEach((v, i) => {
    const k = tipReg(`<div class="h">Ngày ${pad(i + 1)}/${pad(m)}</div>` + tipRow("var(--exp)", "Chi tiêu", fmt(v)) + tipRow("", "Số giao dịch", cnt[i]) + (avg ? tipRow("", "So với TB", (v >= avg ? "+" : "−") + fmtShort(Math.abs(v - avg))) : ""));
    s += `<rect class="hit" data-tip="${k}" x="${pl + cw * i}" y="${pt}" width="${cw}" height="${ih}"/>`;
  });
  s += `</svg>`;
  return { html: `<div class="chart-wrap">${s}</div>`, avg };
}

function viewOverview() {
  const t = totals(S.month), prev = totals(shiftMonth(S.month, -1));
  const bal = walletBalances();
