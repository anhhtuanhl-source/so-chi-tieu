  if (prev.exp > 0) { const d = (t.exp - prev.exp) / prev.exp * 100; cmp = `${d >= 0 ? "▲ Tăng" : "▼ Giảm"} ${Math.abs(d).toFixed(0)}% so với tháng trước`; }
  else cmp = "Tháng trước chưa có chi tiêu";
  const rate = t.inc > 0 ? `Tiết kiệm ${Math.round(t.net / t.inc * 100)}% thu nhập` : "Chưa có thu nhập tháng này";

  const tiles = `<div class="grid tiles">
    <div class="card tile hero">${tileK("wallet", "#fff", "Tổng số dư các ví")}<div class="v">${totalBal < 0 ? "−" : ""}${fmt(Math.abs(totalBal))}</div><div class="s">${S.settings.wallets.length} ví/tài khoản</div></div>
    <div class="card tile inc">${tileK("inc", "var(--inc)", "Thu nhập")}<div class="v">${fmt(t.inc)}</div><div class="s">${monthLabel(S.month)}</div></div>
    <div class="card tile exp">${tileK("exp", "var(--exp)", "Chi tiêu")}<div class="v">${fmt(t.exp)}</div><div class="s">${cmp}</div></div>
    <div class="card tile net">${tileK("net", "var(--c1)", "Còn lại trong tháng")}<div class="v ${t.net < 0 ? "neg-bal" : ""}">${t.net < 0 ? "−" : ""}${fmt(Math.abs(t.net))}</div><div class="s">${rate}</div></div>
  </div>`;

  const daily = dailyChart(S.month);
  const dailyCard = `<div class="card" style="margin-top:16px"><div class="card-h"><h2>Chi tiêu theo ngày</h2>${daily.avg ? `<span class="legend" style="margin:0"><span><i style="background:var(--exp)"></i>Chi trong ngày</span><span><svg width="18" height="4" aria-hidden="true"><line x1="0" x2="18" y1="2" y2="2" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="4 3"/></svg>Trung bình ${fmtShort(daily.avg)}/ngày</span></span>` : ""}</div>${daily.html}</div>`;

  const recent = sortTx(monthTx(S.month)).slice(0, 7);
  const recentHtml = recent.length ? recent.map(txRow).join("") : emptyTx("Chưa có giao dịch nào trong " + monthLabel(S.month).toLowerCase() + ".");
  const sp = spendByCat([S.month]);

  const walletsHtml = S.settings.wallets.map((w, i) => `<div class="wallet-row"><span class="n" style="display:flex;align-items:center;gap:8px"><span class="dot" style="--cc:var(--c${(i % 8) + 1})"></span>${esc(w.name)}</span><span class="b ${bal[w.id] < 0 ? "neg-bal" : ""}">${bal[w.id] < 0 ? "−" : ""}${fmt(Math.abs(bal[w.id] || 0))}</span></div>`).join("");

  const budgets = Object.entries(S.settings.budgets).filter(([id, v]) => v > 0 && catById(id));
  let budgetHtml;
  if (budgets.length) {
    budgetHtml = budgets.map(([id, lim]) => ({ id, lim, sp: sp[id] || 0 })).sort((a, b) => b.sp / b.lim - a.sp / a.lim).slice(0, 5).map(b => {
      const [st, txt] = statusOf(b.sp, b.lim);
      return `<div class="bar-row"><span class="nm" style="display:flex;align-items:center;gap:8px"><span class="dot" style="--cc:${catColor(b.id)}"></span>${esc(catName(b.id))}</span><span class="pill ${st}">${txt}</span><div class="track"><div class="fill ${st}" style="width:${Math.min(100, b.sp / b.lim * 100)}%"></div></div></div>`;
    }).join("");
  } else budgetHtml = `<p class="hint" style="margin:0 0 10px">Đặt hạn mức cho từng danh mục để biết khi nào sắp chi quá tay.</p><button class="btn sm" type="button" data-act="nav" data-v="ngan-sach">Đặt ngân sách</button>`;

  return topbar("Tổng quan") + tiles + dailyCard + `<div class="grid two" style="margin-top:16px">
    <div class="card"><div class="card-h"><h2>Giao dịch gần đây</h2><button class="link" type="button" data-act="nav" data-v="giao-dich">Xem tất cả</button></div>${recentHtml}</div>
    <div class="stack">
      <div class="card"><div class="card-h"><h2>Cơ cấu chi tiêu</h2></div>${catBreakdown([S.month], 1)}</div>
      <div class="card"><div class="card-h"><h2>Ngân sách</h2>${budgets.length ? '<button class="link" type="button" data-act="nav" data-v="ngan-sach">Chi tiết</button>' : ""}</div>${budgetHtml}</div>
      ${savingsLoanCard(totalBal)}
      <div class="card"><div class="card-h"><h2>Số dư từng ví</h2><button class="link" type="button" data-act="nav" data-v="cai-dat">Sửa ví</button></div><div class="wallets">${walletsHtml}</div></div>
    </div></div>`;
}

/* ---------- Giao dịch ---------- */
function inRange(d) { const f = S.f; if (f.from && d < f.from) return false; if (f.to && d > f.to) return false; return true; }
const rangeOn = () => !!(S.f.from || S.f.to);
function baseRows() {
  const useRange = rangeOn();
  const real = useRange ? allTx().filter(t => inRange(t.date)) : monthTx(S.month);
  const virt = virtualRows().filter(r => useRange ? inRange(r.date) : r.date.slice(0, 7) === S.month);
  return { real, virt };
}
function filteredTx() {
  const f = S.f, q = f.q.trim().toLowerCase();
  const { real, virt } = baseRows();
  const r = f.type === "other" ? [] : real.filter(t => {
    if (f.type !== "all" && t.type !== f.type) return false;
    if (f.cat && t.catId !== f.cat) return false;
    if (f.wallet && t.walletId !== f.wallet && t.toWalletId !== f.wallet) return false;
    if (q) { const hay = [t.note, catName(t.catId), walletName(t.walletId), String(t.amount), fmtDate(t.date)].join(" ").toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  });
  const v = (f.type === "all" || f.type === "other") && !f.cat ? virt.filter(x => {
    if (f.wallet && x.walletId !== f.wallet) return false;
    if (q) { const hay = [x.title, x.note, x.sub, String(x.amount), fmtDate(x.date)].join(" ").toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  }) : [];
  return sortTx(r.concat(v));
}
function txListHtml() {
  const list = filteredTx();
  const { real, virt } = baseRows();
  if (!real.length && !virt.length) return rangeOn() ? `<div class="empty"><p>Không có giao dịch nào trong khoảng ngày đã chọn.</p><button class="btn" type="button" data-act="clear-filter">Xóa bộ lọc</button></div>` : emptyTx("Chưa có giao dịch nào trong " + monthLabel(S.month).toLowerCase() + ".");
  if (!list.length) return `<div class="empty"><p>Không có giao dịch khớp bộ lọc.</p><button class="btn" type="button" data-act="clear-filter">Xóa bộ lọc</button></div>`;
  let inc = 0, exp = 0;
  list.forEach(t => { if (t.v) return; if (t.type === "income") inc += t.amount; else if (t.type === "expense") exp += t.amount; });
  const groups = {};
  list.forEach(t => (groups[t.date] = groups[t.date] || []).push(t));
  const showYear = rangeOn() && Object.keys(groups).some(d => d.slice(0, 4) !== todayStr().slice(0, 4));
  return `<div class="sum-line"><span>${list.length} giao dịch</span><span>Thu <b>${fmt(inc)}</b></span><span>Chi <b>${fmt(exp)}</b></span></div>` +
    Object.keys(groups).map(d => {
      const dayExp = groups[d].reduce((a, t) => a + (!t.v && t.type === "expense" ? t.amount : 0), 0);
      return `<div class="day"><div class="day-h"><b>${dayLabel(d)}${showYear ? "/" + d.slice(0, 4) : ""}</b><span class="num">${dayExp ? "Chi " + fmt(dayExp) : ""}</span></div>${groups[d].map(t => t.v ? vRow(t) : txRow(t)).join("")}</div>`;
    }).join("");
}
function quickRange(k) {
  const t = todayStr(), d = new Date();
  const back = n => { const x = new Date(); x.setDate(x.getDate() - n); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`; };
  if (k === "today") return [t, t];
  if (k === "yesterday") { const y = back(1); return [y, y]; }
  if (k === "7d") return [back(6), t];
  if (k === "30d") return [back(29), t];
  if (k === "year") return [`${d.getFullYear()}-01-01`, t];
  return ["", ""];
}
function viewTx() {
  const f = S.f;
  const typeBtn = (v, l) => `<button type="button" data-act="ftype" data-v="${v}" aria-pressed="${f.type === v}">${l}</button>`;
  const catOpts = `<option value="">Mọi danh mục</option>` + S.settings.categories.map(c => `<option value="${esc(c.id)}" ${f.cat === c.id ? "selected" : ""}>${esc(c.name)}${c.type === "income" ? " (thu)" : ""}</option>`).join("");
  const wOpts = `<option value="">Mọi ví</option>` + S.settings.wallets.map(w => `<option value="${esc(w.id)}" ${f.wallet === w.id ? "selected" : ""}>${esc(w.name)}</option>`).join("");
  const qr = (k, l) => { const [a, b] = quickRange(k); return `<button type="button" class="chip" data-act="frange" data-v="${k}" aria-pressed="${rangeOn() && f.from === a && f.to === b}">${l}</button>`; };
  const rangeNote = rangeOn() ? `<div class="banner" style="margin:4px 0 6px"><span>Đang tra cứu ${f.from && f.to && f.from === f.to ? "ngày <b>" + fmtDate(f.from) + "</b>" : (f.from ? "từ <b>" + fmtDate(f.from) + "</b> " : "") + (f.to ? "đến <b>" + fmtDate(f.to) + "</b>" : "")} trên mọi tháng. Bộ chọn tháng phía trên tạm không áp dụng.</span><button class="btn sm" type="button" data-act="frange" data-v="clear" style="margin-left:auto">Bỏ lọc ngày</button></div>` : "";
  return topbar("Giao dịch") + `<div class="card">
    <div class="filters"><div class="seg">${typeBtn("all", "Tất cả")}${typeBtn("expense", "Chi")}${typeBtn("income", "Thu")}${typeBtn("transfer", "Chuyển")}${typeBtn("other", "Quỹ & vay")}</div>
    <input id="f-q" type="search" placeholder="Tìm theo ghi chú, danh mục, số tiền…" value="${esc(f.q)}" aria-label="Tìm kiếm">
    <select id="f-cat" aria-label="Lọc danh mục">${catOpts}</select><select id="f-wallet" aria-label="Lọc ví">${wOpts}</select></div>
    <div class="date-filter"><span class="df-label">Tra cứu theo ngày</span>
      <label class="df-field"><span>Từ</span><input type="date" id="f-from" value="${esc(f.from || "")}" aria-label="Từ ngày"></label>
      <label class="df-field"><span>Đến</span><input type="date" id="f-to" value="${esc(f.to || "")}" aria-label="Đến ngày"></label>
      <div class="chips">${qr("today", "Hôm nay")}${qr("yesterday", "Hôm qua")}${qr("7d", "7 ngày")}${qr("30d", "30 ngày")}${qr("year", "Năm nay")}</div></div>
    ${rangeNote}
    <div id="tx-list">${txListHtml()}</div></div>`;
}

/* ---------- Ngân sách ---------- */
function viewBudget() {
  const sp = spendByCat([S.month]);
  const b = S.settings.budgets;
  let totLim = 0, totSp = 0;
  const rows = cats("expense").map(c => {
    const lim = b[c.id] || 0, s = sp[c.id] || 0;
    if (lim) { totLim += lim; totSp += s; }
    let meta, bar = "";
    if (lim) {
      const [st, txt] = statusOf(s, lim);
      meta = `<span>Đã chi <b class="num">${fmt(s)}</b> / ${fmt(lim)}</span><span class="pill ${st}">${txt}</span>`;
      bar = `<div class="track"><div class="fill ${st}" style="width:${Math.min(100, s / lim * 100)}%"></div></div>`;
    } else meta = `<span>Đã chi <b class="num">${fmt(s)}</b></span><span class="hint">Chưa đặt hạn mức</span>`;
    return `<div class="budget-row"><b style="display:flex;align-items:center;gap:8px"><span class="dot" style="--cc:${catColor(c.id)}"></span>${esc(c.name)}</b><input class="field r" id="bud-${esc(c.id)}" data-bud="${esc(c.id)}" inputmode="decimal" placeholder="Hạn mức / tháng" value="${lim ? fmtNum(lim) : ""}" aria-label="Hạn mức ${esc(c.name)}"><div class="meta">${meta}</div>${bar}</div>`;
  }).join("");
  let head = "";
  if (totLim) {
    const [st, txt] = statusOf(totSp, totLim);
    head = `<div class="grid tiles tiles3" style="margin-bottom:16px">
      <div class="card tile"><div class="k">Tổng hạn mức</div><div class="v">${fmt(totLim)}</div></div>
      <div class="card tile"><div class="k">Đã chi (danh mục có hạn mức)</div><div class="v">${fmt(totSp)}</div></div>
      <div class="card tile"><div class="k">Tình trạng</div><div class="v" style="font-size:16px;margin-top:10px"><span class="pill ${st}" style="font-size:13px">${txt}</span></div></div></div>`;
  }
  return topbar("Ngân sách") + head + `<div class="card"><div class="card-h"><h2>Hạn mức chi mỗi tháng</h2></div>
    <p class="hint" style="margin:-4px 0 8px">Nhập số tiền tối đa cho mỗi danh mục (ví dụ 3tr, 500k). Hạn mức áp dụng cho mọi tháng; để trống nếu không cần.</p>${rows}</div>`;
}

/* ---------- Báo cáo ---------- */
function niceStep(x) { if (!(x > 0)) return 1; const e = Math.floor(Math.log10(x)); const f = x / 10 ** e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * 10 ** e; }
function barPath(x, base, w, h) {
  if (h <= 0) return "";
  const r = Math.min(4, w / 2, h);
  return `M${x},${base}V${base - h + r}Q${x},${base - h} ${x + r},${base - h}H${x + w - r}Q${x + w},${base - h} ${x + w},${base - h + r}V${base}Z`;
}
function axisY(s, lo, hi, step, yy, pl, W, pr) {
  for (let v = lo; v <= hi + 1e-6; v += step) {
    const vv = Math.abs(v) < 1e-6 ? 0 : v;
    s.push(`<line class="gl" x1="${pl}" x2="${W - pr}" y1="${yy(vv)}" y2="${yy(vv)}"/><text class="ax" x="${pl - 8}" y="${yy(vv) + 4}" text-anchor="end">${vv ? fmtShort(vv) : "0"}</text>`);
  }
}
const xLabel = (k, x, H) => `<text class="ax" x="${x}" y="${H - 8}" text-anchor="middle" ${k === S.month ? 'style="font-weight:700;fill:var(--ink)"' : ""}>${monthShort(k)}</text>`;

function monthChart(keys) {
  const data = keys.map(k => ({ k, ...totals(k) }));
  const W = 680, H = 250, pl = 50, pr = 6, pt = 10, pb = 28;
  const max = Math.max(...data.map(d => Math.max(d.inc, d.exp)));
  if (!max) return `<p class="hint">Chưa có dữ liệu trong khoảng thời gian này.</p>`;
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const ih = H - pt - pb, y = v => pt + ih * (1 - v / top), base = y(0);
  const cw = (W - pl - pr) / data.length, bw = Math.max(4, Math.min(26, (cw - 14) / 2));
  const s = [`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Thu và chi theo tháng">`];
  axisY(s, 0, top, step, y, pl, W, pr);
  data.forEach((d, i) => {
    const cx = pl + cw * i + cw / 2;
    s.push(`<path d="${barPath(cx - bw - 1, base, bw, base - y(d.inc))}" fill="var(--inc)"/><path d="${barPath(cx + 1, base, bw, base - y(d.exp))}" fill="var(--exp)"/>`, xLabel(d.k, cx, H));
  });
  s.push(`<line class="base" x1="${pl}" x2="${W - pr}" y1="${base}" y2="${base}"/>`);
  data.forEach((d, i) => {
    const k = tipReg(`<div class="h">${monthLabel(d.k)}</div>` + tipRow("var(--inc)", "Thu", fmt(d.inc)) + tipRow("var(--exp)", "Chi", fmt(d.exp)) + `<div style="margin-top:3px">` + tipRow("", "Chênh lệch", (d.net < 0 ? "−" : "") + fmt(Math.abs(d.net))) + `</div>`);
    s.push(`<rect class="hit" data-tip="${k}" x="${pl + cw * i}" y="${pt}" width="${cw}" height="${ih}"/>`);
  });
  s.push(`</svg>`);
  return `<div class="legend"><span><i style="background:var(--inc)"></i>Thu nhập</span><span><i style="background:var(--exp)"></i>Chi tiêu</span></div><div class="chart-wrap">${s.join("")}</div>`;
}

function stackChart(keys) {
  const sp = spendByCat(keys);
  const ranked = Object.entries(sp).filter(r => r[1] > 0).sort((a, b) => b[1] - a[1]).map(r => r[0]);
  if (!ranked.length) return `<p class="hint">Chưa có khoản chi nào trong khoảng thời gian này.</p>`;
  const hasRest = ranked.length > 7;
  const topIds = hasRest ? ranked.filter(id => (catById(id)?.color ?? 0) !== 0).slice(0, 6) : ranked;
  const series = topIds.map(id => ({ id, label: catName(id), color: catColor(id) }));
  if (hasRest) series.push({ id: "_rest", label: "Khác & còn lại", color: "var(--c0)" });
  const data = keys.map(k => {
    const m = spendByCat([k]); const vals = {};
    let rest = 0;
    Object.entries(m).forEach(([id, v]) => { if (topIds.includes(id)) vals[id] = v; else rest += v; });
    if (hasRest) vals._rest = rest;
    return { k, vals, total: Object.values(m).reduce((a, b) => a + b, 0) };
  });
  const W = 680, H = 250, pl = 50, pr = 6, pt = 10, pb = 28;
  const max = Math.max(...data.map(d => d.total));
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const ih = H - pt - pb, y = v => pt + ih * (1 - v / top), base = y(0);
  const cw = (W - pl - pr) / data.length, bw = Math.max(8, Math.min(40, cw * 0.56));
  const s = [`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cơ cấu chi theo tháng">`];
  axisY(s, 0, top, step, y, pl, W, pr);
  data.forEach((d, i) => {
    const x = pl + cw * i + (cw - bw) / 2;
    let acc = 0;
    const segs = series.filter(se => d.vals[se.id] > 0);
    segs.forEach((se, j) => {
      const v = d.vals[se.id], y0 = y(acc), y1 = y(acc + v), h = y0 - y1;
      const last = j === segs.length - 1;
      if (last) s.push(`<path d="${barPath(x, y0, bw, h)}" fill="${se.color}"/>`);
      else s.push(`<rect x="${x}" y="${y1 + (h > 3 ? 2 : 0)}" width="${bw}" height="${Math.max(0.5, h - (h > 3 ? 2 : 0))}" fill="${se.color}"/>`);
      acc += v;
    });
    s.push(xLabel(d.k, x + bw / 2, H));
  });
  s.push(`<line class="base" x1="${pl}" x2="${W - pr}" y1="${base}" y2="${base}"/>`);
  data.forEach((d, i) => {
    const rows = series.filter(se => d.vals[se.id] > 0).sort((a, b) => d.vals[b.id] - d.vals[a.id]).map(se => tipRow(se.color, se.label, fmt(d.vals[se.id]))).join("");
    const k = tipReg(`<div class="h">${monthLabel(d.k)} · ${fmt(d.total)}</div>` + (rows || `<div class="r">Không có khoản chi</div>`));
    s.push(`<rect class="hit" data-tip="${k}" x="${pl + cw * i}" y="${pt}" width="${cw}" height="${ih}"/>`);
  });
  s.push(`</svg>`);
  const legend = series.map(se => `<span><i style="background:${se.color}"></i>${esc(se.label)}</span>`).join("");
  return `<div class="legend wrap">${legend}</div><div class="chart-wrap">${s.join("")}</div>`;
}

function balanceChart(keys) {
  const init = S.settings.wallets.reduce((a, w) => a + (Number(w.initial) || 0), 0);
  const all = allTx();
  const data = keys.map(k => {
    let v = init;
    all.forEach(t => { if (t.date.slice(0, 7) <= k) { if (t.type === "income") v += t.amount; else if (t.type === "expense") v -= t.amount; } });
    return { k, v };
  });
  const vals = data.map(d => d.v);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (lo === hi) hi = lo + 1e6;
  const step = niceStep((hi - lo) / 4);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const W = 680, H = 220, pl = 50, pr = 14, pt = 14, pb = 28;
  const ih = H - pt - pb, y = v => pt + ih * (1 - (v - lo) / (hi - lo));
  const cw = (W - pl - pr) / data.length, xs = data.map((d, i) => pl + cw * i + cw / 2);
  const s = [`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tổng số dư cuối mỗi tháng"><defs><linearGradient id="balg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--c1)" stop-opacity="0.28"/><stop offset="1" stop-color="var(--c1)" stop-opacity="0"/></linearGradient></defs>`];
  axisY(s, lo, hi, step, y, pl, W, pr);
  const line = data.map((d, i) => `${i ? "L" : "M"}${xs[i]},${y(d.v)}`).join("");
  const floor = y(Math.max(lo, 0));
  s.push(`<path d="${line}L${xs[xs.length - 1]},${floor}L${xs[0]},${floor}Z" fill="url(#balg)"/>`);
  s.push(`<path d="${line}" fill="none" stroke="var(--c1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`);
  data.forEach((d, i) => {
    const last = i === data.length - 1;
    s.push(`<circle cx="${xs[i]}" cy="${y(d.v)}" r="${last ? 5.5 : 4}" fill="var(--c1)" stroke="var(--surface)" stroke-width="2"/>`, xLabel(d.k, xs[i], H));
  });
  const lastD = data[data.length - 1];
  s.push(`<text x="${xs[xs.length - 1]}" y="${y(lastD.v) - 12}" text-anchor="end" style="fill:var(--ink);font-size:12px;font-weight:600;font-family:var(--font-body)">${fmtShort(lastD.v)}</text>`);
  data.forEach((d, i) => {
    const prev = i ? data[i - 1].v : null;
    const k = tipReg(`<div class="h">Cuối ${monthLabel(d.k).toLowerCase()}</div>` + tipRow("var(--c1)", "Tổng số dư", (d.v < 0 ? "−" : "") + fmt(Math.abs(d.v))) + (prev !== null ? tipRow("", "Thay đổi", (d.v - prev >= 0 ? "+" : "−") + fmt(Math.abs(d.v - prev))) : ""));
    s.push(`<rect class="hit" data-tip="${k}" x="${pl + cw * i}" y="${pt}" width="${cw}" height="${ih}"/>`);
  });
  s.push(`</svg>`);
  return `<div class="chart-wrap">${s.join("")}</div>`;
}

function viewReport() {
  const n = S.range;
  const keys = []; for (let i = n - 1; i >= 0; i--) keys.push(shiftMonth(S.month, -i));
  const rangeBtn = (v, l) => `<button type="button" data-act="range" data-v="${v}" aria-pressed="${n === v}">${l}</button>`;
  let ti = 0, te = 0; keys.forEach(k => { const t = totals(k); ti += t.inc; te += t.exp; });
  const table = `<div class="tbl-wrap"><table class="data"><thead><tr><th>Tháng</th><th>Thu</th><th>Chi</th><th>Chênh lệch</th></tr></thead><tbody>${keys.slice().reverse().map(k => { const t = totals(k); return `<tr><td>${monthLabel(k)}</td><td>${fmtNum(t.inc)}</td><td>${fmtNum(t.exp)}</td><td class="${t.net < 0 ? "neg-bal" : ""}">${t.net < 0 ? "−" : ""}${fmtNum(Math.abs(t.net))}</td></tr>`; }).join("")}</tbody></table></div>`;
  return topbar("Báo cáo") + `<div class="grid tiles" style="margin-bottom:16px">
    <div class="card tile inc">${tileK("inc", "var(--inc)", `Tổng thu ${n} tháng`)}<div class="v">${fmt(ti)}</div><div class="s">TB ${fmt(ti / n)}/tháng</div></div>
    <div class="card tile exp">${tileK("exp", "var(--exp)", `Tổng chi ${n} tháng`)}<div class="v">${fmt(te)}</div><div class="s">TB ${fmt(te / n)}/tháng</div></div>
    <div class="card tile net">${tileK("net", "var(--c1)", "Tích lũy")}<div class="v ${ti - te < 0 ? "neg-bal" : ""}">${ti - te < 0 ? "−" : ""}${fmt(Math.abs(ti - te))}</div><div class="s">${ti ? "Tỷ lệ tiết kiệm " + Math.round((ti - te) / ti * 100) + "%" : "Chưa có thu nhập"}</div></div>
    <div class="card tile hero">${tileK("wallet", "#fff", "Khoảng thời gian")}<div class="v" style="font-size:17px">${monthShort(keys[0])} – ${monthShort(keys[keys.length - 1])}</div><div class="s">Kết thúc ở tháng đang chọn</div></div></div>
    <div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Thu và chi theo tháng</h2><div class="seg">${rangeBtn(3, "3 tháng")}${rangeBtn(6, "6 tháng")}${rangeBtn(12, "12 tháng")}</div></div>${monthChart(keys)}</div>
    <div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Cơ cấu chi theo tháng</h2></div>${stackChart(keys)}</div>
    <div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Tổng số dư cuối tháng</h2><span class="hint">Tổng tiền trong tất cả các ví</span></div>${balanceChart(keys)}</div>
    <div class="grid two">
      <div class="card"><div class="card-h"><h2>Chi theo danh mục</h2></div>${catBreakdown(keys, n)}</div>
      <div class="card"><div class="card-h"><h2>Bảng số liệu</h2></div>${table}</div></div>`;
}

function parseSigned(raw) { const s = String(raw).trim(); const neg = /^[-−]/.test(s); const v = parseAmount(s.replace(/^[-−]/, "")); return neg ? -v : v; }

function render() {

function go(view) {

  render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VIEWS.some(v => v[0] === h) && h !== S.view) { S.view = h; render(); } });

/* ---------- modal ---------- */
let M = null; // trạng thái form giao dịch
function openModal(html) { $("#modal").innerHTML = html; $("#scrim").classList.add("open"); }
function closeModal() { $("#scrim").classList.remove("open"); $("#modal").innerHTML = ""; M = null; }
$("#scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#scrim").classList.contains("open")) closeModal(); });

function confirmBox(title, text, okLabel, onOk, onCancel, cancelLabel) {
  openModal(`<h2>${title}</h2><p style="margin:0;color:var(--ink-2)">${text}</p><div class="modal-actions"><span class="sp"></span><button class="btn" type="button" id="cf-no">${cancelLabel || "Hủy"}</button><button class="btn primary" type="button" id="cf-ok" style="background:var(--crit);border-color:var(--crit);color:#fff">${okLabel}</button></div>`);
  $("#cf-no").onclick = () => { closeModal(); if (onCancel) onCancel(); };
  $("#cf-ok").onclick = () => { closeModal(); onOk(); };
}

function findTx(id, m) { const arr = S.months[m] || []; return arr.find(t => t.id === id); }

function openTx(existing) {
  const today = todayStr();
  const defDate = today.slice(0, 7) === S.month ? today : (S.month < today.slice(0, 7) ? (() => { const [y, m] = S.month.split("-").map(Number); return `${S.month}-${pad(new Date(y, m, 0).getDate())}`; })() : S.month + "-01");
  M = existing ? JSON.parse(JSON.stringify(existing)) : { type: "expense", amount: 0, catId: cats("expense")[0]?.id, walletId: S.settings.wallets[0]?.id, toWalletId: S.settings.wallets[1]?.id, date: defDate, note: "" };
  M.isEdit = !!existing; M.origMonth = existing ? existing.date.slice(0, 7) : null;
  drawTx();
  setTimeout(() => $("#m-amt")?.focus(), 30);
}
function drawTx() {
  const t = M;
  if (!S.settings.wallets.length) { openModal(`<h2>Chưa có ví nào</h2><p class="hint">Hãy thêm ít nhất một ví trong Cài đặt trước khi ghi giao dịch.</p><div class="modal-actions"><span class="sp"></span><button class="btn primary" type="button" data-act="goto-settings">Mở Cài đặt</button></div>`); return; }
  const seg = (v, l) => `<button type="button" data-mtype="${v}" aria-pressed="${t.type === v}">${l}</button>`;
  const wOpts = sel => S.settings.wallets.map(w => `<option value="${esc(w.id)}" ${sel === w.id ? "selected" : ""}>${esc(w.name)}</option>`).join("");
  const catChips = t.type === "transfer" ? "" : `<label>Danh mục</label><div class="chips" id="m-cats">${cats(t.type).map(c => `<button type="button" class="chip" data-mcat="${esc(c.id)}" aria-pressed="${t.catId === c.id}">${esc(c.name)}</button>`).join("")}</div>`;
  const walletFields = t.type === "transfer"
    ? `<div class="row2"><div><label for="m-w">Từ ví</label><select class="field" id="m-w">${wOpts(t.walletId)}</select></div><div><label for="m-w2">Đến ví</label><select class="field" id="m-w2">${wOpts(t.toWalletId)}</select></div></div>`
    : `<label for="m-w">${t.type === "income" ? "Nhận vào ví" : "Trả từ ví"}</label><select class="field" id="m-w">${wOpts(t.walletId)}</select>`;
  openModal(`<h2>${t.isEdit ? "Sửa giao dịch" : "Thêm giao dịch"}</h2>
    <div class="seg" style="width:100%;display:grid;grid-template-columns:repeat(3,1fr)">${seg("expense", "Chi tiêu")}${seg("income", "Thu nhập")}${seg("transfer", "Chuyển khoản")}</div>
    <label for="m-amt">Số tiền</label><input class="amount-in" id="m-amt" inputmode="decimal" autocomplete="off" placeholder="0" value="${t.amount ? fmtNum(t.amount) : ""}">
    <div class="hint" id="m-hint" style="margin-top:4px">Gõ nhanh: 50k = 50.000 ₫, 1,5tr = 1.500.000 ₫</div>
    ${catChips}${walletFields}
    <div class="row2"><div><label for="m-date">Ngày</label><input class="field" type="date" id="m-date" value="${esc(t.date)}"></div>
    <div><label for="m-note">Ghi chú</label><input class="field" id="m-note" value="${esc(t.note || "")}" placeholder="Không bắt buộc" maxlength="140"></div></div>
    <div class="err" id="m-err"></div>
    <div class="modal-actions">${t.isEdit ? '<button class="btn danger" type="button" id="m-del">Xóa</button>' : ""}<span class="sp"></span><button class="btn" type="button" id="m-cancel">Hủy</button><button class="btn primary" type="button" id="m-save">Lưu</button></div>`);
  const amt = $("#m-amt");
  amt.addEventListener("input", () => {
    const raw = amt.value;
    if (/^[\d.]*$/.test(raw) && raw) { const n = parseInt(raw.replace(/\./g, ""), 10); if (n) { const pos = raw.length - amt.selectionStart; amt.value = fmtNum(n); const p = Math.max(0, amt.value.length - pos); amt.setSelectionRange(p, p); } }
    const v = parseAmount(amt.value);
    $("#m-hint").textContent = v ? "= " + fmt(v) : "Gõ nhanh: 50k = 50.000 ₫, 1,5tr = 1.500.000 ₫";
  });
  amt.addEventListener("keydown", e => { if (e.key === "Enter") save(); });
  $("#modal").querySelectorAll("[data-mtype]").forEach(b => b.onclick = () => {
    collect(); const nt = b.dataset.mtype; if (nt === t.type) return; t.type = nt;
    if (nt !== "transfer") { const list = cats(nt); if (!list.some(c => c.id === t.catId)) t.catId = list[0]?.id; }
    else if (!t.toWalletId || t.toWalletId === t.walletId) t.toWalletId = S.settings.wallets.find(w => w.id !== t.walletId)?.id;
    drawTx(); $("#m-amt").focus();
  });
  $("#modal").querySelectorAll("[data-mcat]").forEach(b => b.onclick = () => { t.catId = b.dataset.mcat; $("#modal").querySelectorAll("[data-mcat]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
  $("#m-cancel").onclick = closeModal;
  $("#m-save").onclick = save;
  if (t.isEdit) $("#m-del").onclick = () => { const id = t.id, m = t.origMonth; confirmBox("Xóa giao dịch này?", "Giao dịch sẽ bị xóa vĩnh viễn và số dư ví được tính lại.", "Xóa", () => { removeTx(id, m); toast("Đã xóa giao dịch"); }); };
}
function collect() {
  if (!M) return;
  const a = $("#m-amt"); if (a) M.amount = parseAmount(a.value);
  const w = $("#m-w"); if (w) M.walletId = w.value;
  const w2 = $("#m-w2"); if (w2) M.toWalletId = w2.value;
  const d = $("#m-date"); if (d) M.date = d.value;
  const n = $("#m-note"); if (n) M.note = n.value.trim();
}
function save() {
  collect();
  const t = M, err = $("#m-err");
  if (!t.amount) { err.textContent = "Nhập số tiền lớn hơn 0."; $("#m-amt").focus(); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(t.date || "")) { err.textContent = "Chọn ngày hợp lệ."; return; }
  if (t.type === "transfer") { if (!t.toWalletId || t.toWalletId === t.walletId) { err.textContent = "Chọn hai ví khác nhau để chuyển tiền."; return; } }
  else if (!t.catId) { err.textContent = "Chọn danh mục."; return; }
  const rec = { id: t.id || newId(), type: t.type, amount: t.amount, walletId: t.walletId, date: t.date, note: t.note || "", createdAt: t.createdAt || Date.now() };
  if (t.type === "transfer") rec.toWalletId = t.toWalletId; else rec.catId = t.catId;
  const newM = rec.date.slice(0, 7), oldM = t.origMonth, isEdit = t.isEdit;
  if (isEdit) {
    S.months[oldM] = (S.months[oldM] || []).filter(x => x.id !== rec.id);
    if (oldM !== newM) saveMonth(oldM);
  }
  (S.months[newM] = S.months[newM] || []).push(rec);
  saveMonth(newM);
  closeModal();
  if (!isEdit && newM !== S.month) S.month = newM;
  render();
  toast(isEdit ? "Đã cập nhật" : "Đã thêm " + (rec.type === "income" ? "khoản thu " : rec.type === "expense" ? "khoản chi " : "chuyển khoản ") + fmt(rec.amount));
}
function removeTx(id, m) {
  S.months[m] = (S.months[m] || []).filter(x => x.id !== id);
  saveMonth(m); render();
}

  "cycle-color": el => { const c = catById(el.dataset.id); if (!c) return; c.color = ((c.color ?? 0) + 1) % 9; saveSettings(); render(); },
  "add-cat": el => { S.settings.categories.push({ id: "c-" + newId(), name: "Danh mục mới", type: el.dataset.type, color: nextColor(cats(el.dataset.type)) }); saveSettings(); render(); const ins = document.querySelectorAll("[data-cname]"); const id = S.settings.categories[S.settings.categories.length - 1].id; const inp = document.getElementById("cn-" + id); if (inp) { inp.focus(); inp.select(); } },
  "del-cat": el => { const c = catById(el.dataset.id); if (!c) return; confirmBox("Xóa danh mục “" + esc(c.name) + "”?", "Danh mục chưa có giao dịch nào nên có thể xóa an toàn.", "Xóa", () => { S.settings.categories = S.settings.categories.filter(x => x.id !== c.id); delete S.settings.budgets[c.id]; saveSettings(); render(); }); },
  "retry-load": () => { S.loadError = null; render(); startSyncRetry(); },
  "force-signout": async () => { try { await sb.auth.signOut(); } catch (e) {} try { localStorage.removeItem(cacheKey()); } catch (e) {} uid = null; S.auth = "signedout"; S.loadError = null; goLocal(); },
  "auth-tab": el => { S.authTab = el.dataset.v; S.authMsg = ""; render(); },
  "auth-skip": () => { S.skipLogin = true; try { localStorage.setItem(SKIP_KEY, "1"); } catch (e) {} render(); },
  "auth-show": () => { S.skipLogin = false; try { localStorage.removeItem(SKIP_KEY); } catch (e) {} render(); },
  "auth-forgot": async () => {
    const email = ($("#au-email").value || "").trim(); const err = $("#au-err");
    if (!/^\S+@\S+\.\S+$/.test(email)) { err.textContent = "Nhập email của bạn vào ô Email trước."; return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (error) { err.textContent = authErr(error); return; }
    err.style.color = "var(--pos)"; err.textContent = "Đã gửi email đặt lại mật khẩu tới " + email + ".";
  },
  "sign-out": () => confirmBox("Đăng xuất?", "Dữ liệu vẫn nằm an toàn trên tài khoản. Đăng nhập lại bất cứ lúc nào để tiếp tục.", "Đăng xuất", signOut),
  "backup": () => {
    const payload = { app: "so-chi-tieu", version: 1, exportedAt: new Date().toISOString(), settings: S.settings, months: S.months };
    downloadFile(`so-chi-tieu-${todayStr()}.json`, JSON.stringify(payload), "application/json");
    S.lastBackup = Date.now(); lsSave(); render(); toast("Đã tải file sao lưu");
  },
  "restore": () => $("#restore-file").click(),
  "csv-file": () => { downloadFile(`so-chi-tieu-${todayStr()}.csv`, "\ufeff" + buildCsv().csv, "text/csv"); toast("Đã tải file CSV"); },
  "export": async () => {
    const { csv, n } = buildCsv();
    const ta = $("#csv-out"); ta.value = csv; ta.style.display = "block";
    try { await navigator.clipboard.writeText(csv); toast(`Đã sao chép ${n} giao dịch`); }
    catch (e) { ta.focus(); ta.select(); toast("Không sao chép tự động được, hãy chọn và sao chép trong ô bên dưới."); }
  }
};
function buildCsv() {
  const rows = [["Ngày", "Loại", "Số tiền", "Danh mục", "Ví", "Đến ví", "Ghi chú"]];
  const typeName = { expense: "Chi", income: "Thu", transfer: "Chuyển khoản" };
  sortTx(allTx()).reverse().forEach(t => rows.push([t.date, typeName[t.type], t.amount, t.catId ? catName(t.catId) : "", walletName(t.walletId), t.toWalletId ? walletName(t.toWalletId) : "", t.note || ""]));
  return { csv: rows.map(r => r.map(v => { const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(",")).join("\n"), n: rows.length - 1 };
}
function downloadFile(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type: type + ";charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
document.addEventListener("change", e => {
  if (e.target.id !== "restore-file" || !e.target.files[0]) return;
  const file = e.target.files[0]; e.target.value = "";
  file.text().then(txt => {
    let d; try { d = JSON.parse(txt); } catch (err) { toast("File không đúng định dạng sao lưu."); return; }
    if (!d || d.app !== "so-chi-tieu" || !d.settings || typeof d.months !== "object") { toast("Đây không phải file sao lưu của Sổ Chi Tiêu."); return; }
    const n = Object.values(d.months).reduce((a, m) => a + (Array.isArray(m) ? m.length : 0), 0);
    confirmBox("Khôi phục dữ liệu?", `File sao lưu ngày ${esc(new Date(d.exportedAt).toLocaleDateString("vi-VN"))} có ${n} giao dịch. Dữ liệu hiện có trên thiết bị này sẽ được thay thế hoàn toàn.`, "Khôi phục", () => {
      S.settings = normalize(d.settings); S.months = d.months; S.lastBackup = Date.now(); saveSettings(); saveMonth(); render(); toast(`Đã khôi phục ${n} giao dịch`);
    });
  });
});
document.addEventListener("click", e => {
  if (S.mp && !e.target.closest(".mp-wrap")) {
    S.mp = null;
    if (e.target.closest('[data-act="mp-today"]')) return;
    e.stopPropagation(); e.preventDefault(); render();
  }
}, true);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.mp) { S.mp = null; render(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const fn = actions[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener("input", e => {
  if (e.target.id === "f-q") { S.f.q = e.target.value; $("#tx-list").innerHTML = txListHtml(); }
});
document.addEventListener("change", e => {
  const el = e.target, d = el.dataset;
  if (el.id === "f-cat") { S.f.cat = el.value; render(); }
  else if (el.id === "f-wallet") { S.f.wallet = el.value; render(); }
  else if (el.id === "f-from" || el.id === "f-to") {
    S.f[el.id === "f-from" ? "from" : "to"] = el.value || "";
    if (S.f.from && S.f.to && S.f.from > S.f.to) { const x = S.f.from; S.f.from = S.f.to; S.f.to = x; }
    render();
  }
  else if (d.bud) {
    const v = parseAmount(el.value);
    if (v) S.settings.budgets[d.bud] = v; else delete S.settings.budgets[d.bud];
    saveSettings(); render();
  } else if (d.wname) {
    const w = walletById(d.wname); const v = el.value.trim();
    if (w && v && v !== w.name) { w.name = v; saveSettings(); } else if (w && !v) el.value = w.name;
  } else if (d.winit) {
    const w = walletById(d.winit); if (w) { const v = parseSigned(el.value); if (v !== w.initial) { w.initial = v; saveSettings(); } render(); }
  } else if (d.cname) {
    const c = catById(d.cname); const v = el.value.trim();
    if (c && v && v !== c.name) { c.name = v; saveSettings(); } else if (c && !v) el.value = c.name;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches("[data-bud],[data-winit],[data-wname],[data-cname]")) e.target.blur();
});

/* ---------- khởi động ---------- */
try {
  const u = new URL(location.href);
  if (u.searchParams.has("_nf_embed")) { u.searchParams.delete("_nf_embed"); history.replaceState(null, "", u.pathname + (u.search || "") + u.hash); }
} catch (e) {}
const h0 = location.hash.slice(1);
if (VIEWS.some(v => v[0] === h0)) S.view = h0;
render();
initStore();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
